  case 'oficina':return bOfi('red');case 'gob':return bOfi('gob');case 'sede':return bOfi('sede');case 'imprenta':return bOfi('imprenta');case 'salon':return bSalon('salon');case 'casa':return bSalon('casa');
  case 'cuartel':return bCuartel();case 'estacion':return bEst();case 'casapueblo':return bCasaP();case 'garaje':return bGaraje();case 'celda':return bCelda();default:return bTienda(TYPE_OF[bld]||bld);}}

// =====================================================================
//  ENTRAR Y SALIR
// =====================================================================
let saved=null;
function place(sp){CD.placePlayer(IN.X(sp.x),IN.Z(sp.z),sp.yaw);PL.g.position.y=IN.Y;}
function setHost(id){
  const B=IN;if(!B)return;
  if(B.host){B.g.remove(B.host);B.talk=B.talk.filter(t=>t.m!==B.host);const c=B.host.userData.circ;if(c){const i=CD.circ.indexOf(c);if(i>=0)CD.circ.splice(i,1);}B.host=null;}
  place(B.spawn);
  if(id==='cortes'&&B.tribune){place({x:B.tribune.x,z:B.tribune.z,yaw:0});B.talkTo=null;return;}
  const h=EVHOST[id];if(!h){B.talkTo=null;return;}
  const hp=B.hostAt;B.host=B.npc(LK[h[0]],hp.x,hp.z,hp.yaw,{name:h[1],lines:HOSTL[h[0]]||TALK.gen});B.talkTo=B.host;
}
CD.enterInterior=async function(bld,o={}){
  const lock=!o.event;if(lock)G.busy=true;
  await CD.fade(1,350);if(IN)teardown();
  const B=build(bld);B.bld=bld;B.slot=o.slot;B.name=o.name||'';IN=CD.interior=B;
  scene.add(B.g);CD.applyFlat(B.g);CD.hideCity(true);
  saved={col:CD.col.splice(0),circ:CD.circ.splice(0)};CD.col.push(...B.cols);CD.circ.push(...B.circs);
  if(o.event)setHost(o.event);else place(B.spawn);
  CD.ceilY=B.Y+B.h-.35;document.body.classList.add('inside');CD.AU.env.interior=true;CD.AU.env.crowd=B.crowdLevel||.05;
  CD.emit('enterInterior',B);
  if(B.name&&!o.event)CD.help(B.name+(B.exit?' · Pulsa E junto a la puerta para salir.':''),3500);
  await CD.fade(0,450);if(lock)G.busy=false;
};
function teardown(){
  const B=IN;if(!B)return null;scene.remove(B.g);
  CD.col.length=0;CD.col.push(...saved.col);CD.circ.length=0;CD.circ.push(...saved.circ);saved=null;
  IN=CD.interior=null;CD.ceilY=null;CD.hideCity(false);document.body.classList.remove('inside');CD.AU.env.interior=false;
  CD.emit('exitInterior',B);return B;
}
CD.exitInterior=async function(o={}){
  if(!IN)return;
  if(o.silent){teardown();CD.fadeReset();return;}
  G.busy=true;await CD.fade(1,350);const B=teardown();
  if(!o.keepPos&&B&&B.slot!=null&&CD.slots[B.slot]){const s=CD.slots[B.slot];CD.placePlayer(s.door.x,s.door.z+.9,0);G.cy=Math.PI+.9;}
  await CD.fade(0,450);CD.fadeReset();G.busy=false;
};
CD.saveSpot=()=>{if(IN&&IN.slot!=null&&CD.slots[IN.slot]){const d=CD.slots[IN.slot].door;return {x:d.x,z:d.z+.9,yaw:0};}return {x:PL.g.position.x,z:PL.g.position.z,yaw:PL.yaw};};

// los sucesos ocurren dentro de su edificio
CD.eventRunner=async function(id){
  const ev=L.EVENTS[id],bld=G.cell?'celda':ev.bld;
  if(!IN||IN.bld!==bld)await CD.enterInterior(bld,{event:id,slot:G.cell?null:ev.slot,name:ev.label});else setHost(id);
  try{await ev.run(CD.api);}finally{if(IN)IN.talkTo=null;}
};

// =====================================================================
//  INTERACCIÓN DENTRO Y FUERA
// =====================================================================
function nearVisit(){
  if(!G.st)return null;const p=PL.g.position,pend=new Set(CD.pending().map(id=>L.EVENTS[id].slot)),ch=L.CHAPTERS[G.st.ch];
  for(let i=0;i<CD.slots.length;i++){const s=CD.slots[i];if(!s||pend.has(i)||Math.hypot(s.door.x-p.x,s.door.z-p.z)>3.2)continue;
    const id=ch.events.find(e=>L.EVENTS[e].slot===i);if(id)return{slot:i,bld:L.EVENTS[id].bld,name:L.EVENTS[id].label};
    if(i===2)return{slot:i,bld:'sede',name:'Sede del partido'};const g=CD.GENSHOPS[i%CD.GENSHOPS.length];return{slot:i,bld:g[0],name:g[1]};}
  return null;}
function nearTalk(){if(!IN)return null;const p=PL.g.position;let best=null,bd=2.3;for(const t of IN.talk){if(t.m.userData.down)continue;const q=t.m.position,d=Math.hypot(q.x-p.x,q.z-p.z);if(d<bd){bd=d;best=t;}}return best;}
const nearLocal=(pt,r)=>IN&&pt&&Math.hypot(PL.g.position.x-IN.X(pt.x),PL.g.position.z-IN.Z(pt.z))<r;
async function passTime(h,text){G.busy=true;await CD.fade(1,500);G.hour=(G.hour+h)%24;await CD.fade(0,500);CD.fadeReset();await CD.UI.say('Narrador',text);G.busy=false;}
CD.addInteract(40,{test(){if(!IN||!IN.exit||G.cell)return null;return nearLocal(IN.exit,1.4)?'Salir a la calle':null;},act(){CD.exitInterior();}});
CD.addInteract(35,{test(){if(!IN||!G.st)return null;const f=G.st.f,ch=G.st.ch;
    if(IN.rest&&nearLocal(IN.rest,2.4)&&(f['desc'+ch]|0)<2)return 'Descansar unas horas';
    if(IN.tertulia&&nearLocal(IN.tertulia,2.1)&&(f['tert'+ch]|0)<3)return IN.bld==='taberna'?'Tomar un vino y charlar (−1 fondos)':'Sentarte a la tertulia (−2 fondos)';return null;},
  async act(){const f=G.st.f,ch=G.st.ch;
    if(IN.rest&&nearLocal(IN.rest,2.4)){f['desc'+ch]=(f['desc'+ch]|0)+1;await passTime(8,'Duermes de un tirón por primera vez en semanas. Al despertar, el mundo parece un poco menos hostil.');CD.api.fx({cordura:15,partido:-2});}
    else if(IN.bld==='taberna'){f['tert'+ch]=(f['tert'+ch]|0)+1;await passTime(2,'Un vino, una partida de mus y conversaciones que no tienen nada que ver con la política.');CD.api.fx({cordura:4,fondos:-1});}
    else{f['tert'+ch]=(f['tert'+ch]|0)+1;await passTime(3,'Pasas la tarde entre escritores, versos y discusiones sobre literatura. Por unas horas, olvidas todo lo demás.');CD.api.fx({cordura:6,poesia:2,fondos:-2});}}});
CD.addInteract(30,{test(){const t=nearTalk();this.t=t;return t?'Hablar con '+t.name.charAt(0).toLowerCase()+t.name.slice(1):null;},
  async act(){const t=this.t;if(!t||G.busy)return;G.busy=true;IN.talkTo=t.m;await CD.UI.say(t.name,pick(t.lines));if(IN)IN.talkTo=null;G.busy=false;}});
CD.addInteract(20,{test(){if(IN||G.cell)return null;const v=nearVisit();this.v=v;return v?'Entrar: '+v.name:null;},act(){const v=this.v;if(v)CD.enterInterior(v.bld,{slot:v.slot,name:v.name});}});

// =====================================================================
//  LUZ, ANIMACIÓN Y CÁMARA DE CONVERSACIÓN
// =====================================================================
CD.on('update',dt=>{
  if(!IN)return;const t=G.time;
  for(const m of IN.anim){const u=m.userData;if(u.down)continue;u.head.rotation.y=Math.sin(t*.4+u.ph)*.35;if(!u.sit)u.torso.position.y=.92+Math.sin(t*1.5+u.ph)*.01;}
  for(const m of IN.typists||[]){const u=m.userData;if(u.down)continue;u.armL.rotation.x=-1.1+Math.sin(t*14+u.ph)*.12;u.armR.rotation.x=-1.1+Math.sin(t*14+u.ph+1.6)*.12;}
  for(const s of IN.spin)s.o.rotation[s.ax]+=dt*s.v;for(const f of IN.flick)f.intensity=f.userData.base*(.8+Math.random()*.35);
  if(IN.crowd)IN.crowd.update(t);
  if(IN.talkTo&&G.busy){const u=IN.talkTo.userData;if(!u.sit)u.armR.rotation.x=-.3+Math.sin(t*3)*.25;}
  if(!CD.envLock)CD.AU.env.crowd=IN.crowdLevel||.05;
});
CD.on('render',()=>{if(!IN)return;CD.sun.intensity=0;CD.hemi.intensity=IN.amb||.5;scene.background.set(IN.bg||'#120e0b');scene.fog.color.set(IN.bg||'#120e0b');scene.fog.near=40;scene.fog.far=160;});
let talkKey=null;const tm=new T.Vector3(),tpos=new T.Vector3(),tlook=new T.Vector3();
CD.addCam(50,dt=>{
  if(!IN||!G.busy||!IN.talkTo){talkKey=null;return false;}
  const a=PL.g.position,b=IN.talkTo.position;
  if(talkKey!==IN.talkTo){talkKey=IN.talkTo;
    const dx=b.x-a.x,dz=b.z-a.z,l=Math.hypot(dx,dz)||1,ux=dx/l,uz=dz/l,px=-uz,pz=ux;PL.yaw=Math.atan2(dx,dz);PL.g.rotation.y=PL.yaw;IN.talkTo.rotation.y=Math.atan2(-dx,-dz);
    tm.set((a.x+b.x)/2,a.y+1.5,(a.z+b.z)/2);const room=s=>{for(let k=.5;k<=3.4;k+=.3)if(CD.insideBld(tm.x+px*s*k,1.7,tm.z+pz*s*k))return k-.35;return 3.4;};
    const r1=room(1),r2=room(-1),sd=r1>=r2?1:-1,dist=clamp(Math.max(r1,r2),1.1,3);tpos.set(tm.x+px*sd*dist-ux*.6,tm.y+.2,tm.z+pz*sd*dist-uz*.6);tlook.copy(tm);cam.position.copy(tpos);}
  cam.position.lerp(tpos,1-Math.exp(-dt*6));cam.lookAt(tlook);return true;
});

// salir automáticamente al cambiar de capítulo, cargar, terminar o volver al título
for(const ev of ['chapter','gameStart','ending','toTitle'])CD.on(ev,()=>{if(IN)CD.exitInterior({silent:true});});
})();
</script>

<!-- ▼▼▼ AQUÍ IRÁ LA PARTE 6 (combate y policía) ▼▼▼ -->
<script id="combate">
/* =====================================================================
   CARA AL DESTINO · PARTE 6 · COMBATE, POLICÍA Y ESCOLTA
   Puñetazos, pistola, nivel de búsqueda, guardias, grupos rivales,
   camaradas de escolta, heridas, detención y consecuencias
   ===================================================================== */
(function(){
'use strict';
const CD=window.CD;if(!CD||!CD.enterInterior)return;
const {T,L,$,clamp,rnd,pick,lerp,angLerp,d2,G,scene,cam,K,P,W,PL}=CD;
const snd=(n,p)=>CD.sfx(n,p);

// =====================================================================
//  ESTADO
// =====================================================================
const ACT=CD.actors=[];
const WANT=CD.WANT={stars:0,decay:0,seen:false};
let spawnT=0,rivalT=60,escT=2,btnT=0,punchT=0,pendHit=0,fireCd=0,reloadT=0,drawn=false,touchAim=false,lastVictim=null,report=null,jailing=false,lastShotFx=-99;
const hasGun=()=>!!(G.st&&(G.st.f.pistola||G.st.f.arma));
const aiming=CD.aiming=()=>G.mode==='game'&&!G.busy&&drawn&&hasGun()&&(CD.isTouch?touchAim:!!K.aim);
CD.customWanted=true;
const INSULT=['Un grupo rival: «¡Fascistas, fuera de nuestro barrio!»','Un grupo rival: «¡Señorito, aquí no se te ha perdido nada!»','Un grupo rival: «¡Mirad quién viene, el hijo del dictador!»','Un grupo rival: «¡A ver si eres tan valiente sin escolta!»'];

// ---------- arma ----------
function makeGun(){const g=new T.Group(),m=CD.mat('#1a1a1a'),b=new T.Mesh(CD.BOX,m);b.scale.set(.05,.26,.07);b.position.set(0,-.1,.02);
  const h=new T.Mesh(CD.BOX,m);h.scale.set(.045,.07,.13);h.position.set(0,.02,-.04);g.add(b,h);g.position.set(0,-.62,.04);g.visible=false;return g;}
function ensureGun(g){const u=g.userData;if(u&&u.armR&&!u.gun){u.gun=makeGun();u.armR.add(u.gun);}return u.gun;}
const _v=new T.Vector3();
function gunPos(g){const u=g.userData;if(u.gun&&u.gun.visible){u.gun.getWorldPosition(_v);return {x:_v.x,y:_v.y,z:_v.z};}const p=g.position;return {x:p.x,y:p.y+1.4,z:p.z};}

// ---------- efectos ----------
const ML=new T.PointLight('#ffcf80',0,9,2);scene.add(ML);
const TR=[];for(let i=0;i<8;i++){const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute([0,0,0,0,0,0],3));
  const l=new T.Line(g,new T.LineBasicMaterial({color:'#ffe9a0',transparent:true,opacity:0}));l.frustumCulled=false;scene.add(l);TR.push({l,t:0});}
const PUF=[];for(let i=0;i<8;i++){const m=new T.Mesh(new T.BoxGeometry(.25,.25,.25),new T.MeshBasicMaterial({color:'#bfb5a3',transparent:true,opacity:0,depthWrite:false}));m.visible=false;scene.add(m);PUF.push({m,t:0});}
const BLOODM=new T.MeshBasicMaterial({color:'#3a0a08',transparent:true,opacity:.85,depthWrite:false}),BLOODG=new T.CircleGeometry(.55,8);
const flash=p=>{ML.position.set(p.x,p.y,p.z);ML.intensity=3;};
CD.tracer=function(a,b){const s=TR.find(x=>x.t<=0)||TR[0],q=s.l.geometry.attributes.position;q.setXYZ(0,a.x,a.y,a.z);q.setXYZ(1,b.x,b.y,b.z);q.needsUpdate=true;s.t=.08;s.l.material.opacity=.9;};
CD.puff=function(p){const s=PUF.find(x=>x.t<=0)||PUF[0];s.m.position.set(p.x,p.y,p.z);s.m.visible=true;s.t=.5;};
function addBlood(a){const m=new T.Mesh(BLOODG,BLOODM),p=a.g.position;m.rotation.x=-Math.PI/2;m.position.set(p.x-Math.sin(a.yaw)*.7,CD.groundY(p.x,p.z)+.013,p.z-Math.cos(a.yaw)*.7);scene.add(m);a.decal=m;}
function updFx(dt){ML.intensity=Math.max(0,ML.intensity-dt*40);for(const s of TR)if(s.t>0){s.t-=dt;s.l.material.opacity=Math.max(0,s.t/.08*.9);}
  for(const s of PUF)if(s.t>0){s.t-=dt;s.m.scale.setScalar(1+(.5-s.t)*5);s.m.material.opacity=s.t*1.2;if(s.t<=0)s.m.visible=false;}}

// =====================================================================
//  PERSONAJES CON INTELIGENCIA
// =====================================================================
const LOOK={cop:()=>({jacket:'#3d4f6b',shirt:'#3d4f6b',pants:'#2c3a52',hat:'gorra',hatC:'#2c3a52',skin:pick(CD.SKINS),beard:pick(['nada','bigote','bigotito'])}),
  rival:()=>({shirt:pick(['#d8d0bf','#b9a27a','#6f7f8f']),jacket:pick([null,'#5b4a3a']),pants:pick(['#3f4652','#3a3a3a']),tie:'#c0392b',hat:pick(['gorra','boina',null]),hatC:'#4a4038',skin:pick(CD.SKINS),beard:pick(['nada','bigote','barba'])}),
  esc:()=>({shirt:'#34507f',pants:'#3a3028',badge:1,hair:pick(['corto','raya','rapado']),hairC:pick(['#1a120c','#3a2a1c','#5a3a22']),skin:pick(CD.SKINS)})};
CD.ALOOK=LOOK;
function newActor(kind,g,o){const a=Object.assign({kind,g,hp:100,st:'idle',spd:0,yaw:g.rotation.y,t:0,cool:0,hitT:0,punchT:0},o||{});ACT.push(a);return a;}
const inBounds=q=>{q.x=clamp(q.x,-W.HALF+2,W.HALF-2);q.z=clamp(q.z,-W.HALF+2,W.HALF-2);CD.collide(q,.4);return q;};
function spawnAt(kind,x,z,o){const q=inBounds({x,z}),g=CD.makeHuman(LOOK[kind]());g.position.set(q.x,CD.groundY(q.x,q.z),q.z);scene.add(g);if(kind==='cop')ensureGun(g);return newActor(kind,g,Object.assign({own:true},o));}
function spawnAround(kind,r0,r1,o){const p=PL.g.position,a=Math.random()*Math.PI*2,r=rnd(r0,r1);return spawnAt(kind,p.x+Math.cos(a)*r,p.z+Math.sin(a)*r,o);}
const randNear=(p,r)=>inBounds({x:p.x+rnd(-r,r),z:p.z+rnd(-r,r)});
function promotePed(q){q.custom=true;return newActor('civ',q.g,{ped:q});}
function promoteWalker(w){
  const g=CD.makeHuman({shirt:w.body,pants:w.pants,fem:w.fem,skin:w.skin,hat:w.hat===1?'fedora':w.hat===2?'gorra':w.hat===3?'panuelo':null,hatC:w.hatC});
  g.position.set(w.x,CD.groundY(w.x,w.z),w.z);g.rotation.y=w.yaw||0;scene.add(g);w.saved={mode:w.mode,x:w.x,z:w.z};w.mode='gone';return newActor('civ',g,{walker:w,own:true});}
function release(a){
  const i=ACT.indexOf(a);if(i>=0)ACT.splice(i,1);if(a.decal)scene.remove(a.decal);
  if(a.ped){if(a.dead){scene.remove(a.g);const j=CD.peds.indexOf(a.ped);if(j>=0)CD.peds.splice(j,1);}
    else{a.g.rotation.set(0,a.g.rotation.y,0);a.g.userData.armOverride=false;a.g.userData.torso.position.y=.92;a.ped.custom=!CD.city.visible;a.ped.wait=0;}}
  else if(a.own)scene.remove(a.g);
  if(a.walker){const w=a.walker;w.mode=w.saved.mode;if(w.mode!=='walk'){w.x=w.saved.x;w.z=w.saved.z;}}
}
function clearAll(){for(const a of ACT.slice())release(a);WANT.stars=0;WANT.decay=0;report=null;PL.hp=100;drawn=false;touchAim=false;updateStars();CD.lockYaw=false;CD.speedMul=1;}
function clearHostiles(){for(const a of ACT.slice())if(a.kind!=='esc')release(a);}
CD.clearHostiles=clearHostiles;
function moveTo(a,tx,tz,spd,dt,stop){
  const p=a.g.position,dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);if(d<(stop||.3)){a.spd=lerp(a.spd,0,Math.min(1,dt*8));return d;}
  a.yaw=angLerp(a.yaw,Math.atan2(dx,dz),Math.min(1,dt*8));a.spd=lerp(a.spd,spd,Math.min(1,dt*6));p.x+=Math.sin(a.yaw)*a.spd*dt;p.z+=Math.cos(a.yaw)*a.spd*dt;CD.collide(p,.35);p.y=CD.groundY(p.x,p.z);return d;}
function panicAround(pos,r,max){
  let n=0;const r2=r*r;
  for(const a of ACT)if(a.kind==='civ'&&!a.dead&&!a.ko&&d2(a.g.position,pos)<r2){a.st='flee';a.threat={x:pos.x,z:pos.z};a.t=0;}
  for(const q of CD.peds.slice()){if(n>=max||ACT.length>28)break;if(q.custom||!q.g.visible)continue;if(d2(q.g.position,pos)<r2){const a=promotePed(q);a.st=Math.random()<.25?'cower':'flee';a.cowerT=rnd(1,3);a.threat={x:pos.x,z:pos.z};n++;}}
  for(const w of CD.WK.list){if(n>=max||ACT.length>28)break;if(w.hid||w.mode==='gone')continue;if((w.x-pos.x)**2+(w.z-pos.z)**2<r2){const a=promoteWalker(w);a.st=Math.random()<.2?'cower':'flee';a.cowerT=rnd(1,2.5);a.threat={x:pos.x,z:pos.z};n++;}}
  if(n)snd('scream',pos);
}
function witnesses(pos,r){const r2=r*r;for(const a of ACT)if(a.kind==='civ'&&!a.dead&&!a.ko&&d2(a.g.position,pos)<r2)return 1;
  for(const q of CD.peds)if(!q.custom&&q.g.visible&&d2(q.g.position,pos)<r2)return 1;for(const w of CD.WK.list)if(!w.hid&&w.mode!=='gone'&&(w.x-pos.x)**2+(w.z-pos.z)**2<r2)return 1;return 0;}

// ---------- nivel de búsqueda ----------
function updateStars(){const s=WANT.stars;document.querySelectorAll('#wanted i').forEach((e,i)=>{e.classList.toggle('on',i<s);e.classList.toggle('blink',i<s&&!WANT.seen);});}
function raise(s){if(s<=WANT.stars||CD.combatOff)return;WANT.stars=Math.min(5,s);WANT.decay=0;updateStars();snd('whistle');
  if(!G.st.f.avisoBusca){G.st.f.avisoBusca=1;CD.help('La policía te busca. Aléjate de los guardias y escóndete hasta despistarlos. Si te alcanzan con pocas estrellas, te detienen; con tres o más, disparan.',7000);}}
function crime(sev,pos){if(!sev)return;if(CD.interior){raise(Math.max(1,sev-1));return;}
  for(const a of ACT)if(a.kind==='cop'&&!a.dead&&!a.ko&&d2(a.g.position,pos)<35*35){raise(sev);return;}
  if(witnesses(pos,26)&&(!report||report.sev<sev-1))report={sev:Math.max(1,sev-1),t:4};}
function updWanted(dt){
  if(report){report.t-=dt;if(report.t<=0){raise(report.sev);CD.help('Alguien ha avisado a la policía.',3000);report=null;}}
  const s=WANT.stars,p=PL.g.position;let seen=false;
  if(s>0&&!CD.interior)for(const a of ACT)if(a.kind==='cop'&&!a.dead&&!a.ko&&d2(a.g.position,p)<30*30){seen=true;break;}
  if(s>0){WANT.decay+=dt*(CD.interior?1.8:1);if(seen)WANT.decay=0;if(WANT.decay>11){WANT.stars--;WANT.decay=0;if(!WANT.stars)CD.help('Has despistado a la policía.',3000);}}
  if(drawn&&s===0&&!CD.interior)for(const a of ACT)if(a.kind==='cop'&&!a.dead&&!a.ko&&d2(a.g.position,p)<16*16){raise(1);CD.help('Un guardia te ha visto con un arma en la mano.',3000);break;}
  if(seen!==WANT.seen){WANT.seen=seen;}updateStars();

  for(const q of CD.peds)if(!q.custom&&q.g.visible&&d2(q.g.position,p)<m2)out.push({kind:'ped',ref:q,x:q.g.position.x,y:q.g.position.y,z:q.g.position.z});

function raycast(o,d,maxT){let best={t:maxT,c:null,head:false};
  for(const c of candidates(maxT+5)){const by=c.y+(c.sit?-.4:0);let t=rs(o,d,c.x,by+1.83,c.z,.19);if(t>0&&t<best.t)best={t,c,head:true};t=rs(o,d,c.x,by+1.25,c.z,.34);if(t>0&&t<best.t)best={t,c,head:false};t=rs(o,d,c.x,by+.6,c.z,.25);if(t>0&&t<best.t)best={t,c,head:false};}

  if(d.y<-1e-4){const t=(.2-o.y)/d.y;if(t>0&&t<best.t)best={t,c:null,ground:true};}

function nearNPC(){const p=PL.g.position;let b=null,bd=2.3;for(const n of NPCS){if(!n.lines||n.argued||n.st==='fight'||n.m.userData.down)continue;const d=Math.hypot(n.m.position.x-p.x,n.m.position.z-p.z);if(d<bd){bd=d;b=n;}}return b;}
async function argue(n){

const nearPt=(x,z,r)=>Math.hypot(PL.g.position.x-IN.X(x),PL.g.position.z-IN.Z(z))<r;
CD.addInteract(90,{test(){if(!MIT.on||!MIT.free)return null;

function onDown(n){const v={burgueses:-14,estudiantes:n.hostile?8:-6,campesinos:-12,obreros:-10}[MIT.aud]||-8;add(v);if(v>0)cheer(.8);else boo();}
CD.groundOverride=null;
CD.on('update',dt=>{
  if(!MIT.on)return;const P=PL.g.position;
  for(const n of NPCS){const m=n.m,u=m.userData;
    if(u.down){if(n.st!=='down'){n.st='down';onDown(n);}continue;}
    if(u.hp!=null&&u.hp<n.lastHp){n.lastHp=u.hp;if(n.st!=='fight'&&n.violent&&MIT.free){n.st='fight';n.cool=.6;}}
    let spd=0;
    if(n.goal){const dx=n.goal.x-m.position.x,dz=n.goal.z-m.position.z,d=Math.hypot(dx,dz);if(d<.3){const r=n.goal.res;n.goal=null;r&&r();}
      else{n.yaw=angLerp(n.yaw,Math.atan2(dx,dz),Math.min(1,dt*8));spd=n.goal.spd;m.position.x+=Math.sin(n.yaw)*spd*dt;m.position.z+=Math.cos(n.yaw)*spd*dt;}}
    else if(n.st==='fight'&&MIT.free){const dx=P.x-m.position.x,dz=P.z-m.position.z,d=Math.hypot(dx,dz);n.yaw=angLerp(n.yaw,Math.atan2(dx,dz),Math.min(1,dt*10));
      if(d>1){spd=3.6;m.position.x+=Math.sin(n.yaw)*spd*dt;m.position.z+=Math.cos(n.yaw)*spd*dt;}
      n.cool-=dt;if(d<1.2&&n.cool<=0&&!G.busy){n.cool=rnd(1,1.5);n.punch=.35;CD.sfx('punch',m.position);CD.hurtPlayer(rnd(6,10));}if(d>10)n.st='idle';}
    else if(n.st==='brawl'){if(!(n.punch>0)&&Math.random()<dt*1.4)n.punch=.35;if(MIT.free&&Math.hypot(P.x-m.position.x,P.z-m.position.z)<1.5){n.st='fight';n.cool=.5;}}
    if(n.face&&!n.goal&&n.st!=='fight'){const t=n.face==='player'?P:n.face;n.yaw=angLerp(n.yaw,Math.atan2(t.x-m.position.x,t.z-m.position.z),Math.min(1,dt*5));}
    m.rotation.y=n.yaw;n.spd=lerp(n.spd,spd,Math.min(1,dt*8));if(n.spd>.1)CD.animHuman(m,n.spd,dt);
    if(n.punch>0){n.punch-=dt;u.armOverride=true;u.armR.rotation.x=-1.6*Math.sin((1-Math.max(0,n.punch)/.35)*Math.PI);}
    else if(n.gest){u.armOverride=true;u.armR.rotation.x=-.5+Math.sin(G.time*3)*.35;}else u.armOverride=false;}
  if(IN.crowd){IN.crowd.mood=lerp(IN.crowd.mood||0,(MIT.enth-50)/50,Math.min(1,dt*1.5));IN.crowd.cheer=Math.max(0,(IN.crowd.cheer||0)-dt*.5);}
  CD.AU.env.crowd=.12+MIT.enth/100*.35+(IN.crowd?IN.crowd.cheer*.3:0);
  CD.bar('Entusiasmo del público','',MIT.enth/100);
  if(MIT.free&&!G.busy){MIT.freeT-=dt;if(MIT.freeT<10&&!MIT.warned){MIT.warned=true;CD.help('La organización te reclama en la tribuna.',3000);}
    if(MIT.autoEnd&&MIT.autoEnd()){MIT.autoT+=dt;if(MIT.autoT>2)endFree();}if(MIT.freeT<=0)endFree();}
});

(function(){

const AG=[];
function agent(look,x,z,o={}){const m=CD.makeHuman(Object.assign({skin:pick(CD.SKINS)},look));m.position.set(x,o.y!=null?o.y:CD.groundY(x,z),z);m.rotation.y=o.yaw||0;(o.parent||scene).add(m);
  const a=Object.assign({m,yaw:o.yaw||0,spd:0,hp:100,st:'idle',t:0,cool:0,hitT:0},o);AG.push(a);return a;}
function agMove(a,tx,tz,spd,dt,stop,noCol){const p=a.m.position,dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);if(d<(stop||.3)){a.spd=lerp(a.spd,0,Math.min(1,dt*8));return d;}

      if(r.st==='climb'){r.ct+=dt;q.y=Y+Math.sin(Math.min(1,r.ct/.8)*Math.PI)*.9;q.z=lerp(Z(-1.8),Z(-3.2),Math.min(1,r.ct/.8));if(r.ct>.8){r.st='go';q.y=Y;}}

      else if(r.st==='back'){agMove(r,q.x,Z(-1),4,dt,.3,true);if(q.z>Z(-2.2))r.gone=true;}
      agAnim(r,dt);}
    for(const r of st.riot.filter(r=>r.gone)){const i=IN.anim.indexOf(r.m);if(i>=0)IN.anim.splice(i,1);agDel(r);}st.riot=st.riot.filter(r=>!r.gone);

});}

CD.runAction=async name=>{const d=DEFS[name];if(!d)return oldAction(name);return runMission(d);};

// =====================================================================
//  ENCARGOS SECUNDARIOS
// =====================================================================
const SIDE=CD.SIDE={givers:[],act:null,cool:20};
const TYPES={
  carteles:{who:'Un camarada',look:{shirt:'#34507f',pants:'#3a3028',badge:1},ch:1,ask:'Jefe, tenemos carteles nuevos y nadie se atreve a pegarlos en el centro. ¿Nos echa una mano? Cuatro sitios, antes de que pase la ronda.'},
  fondos:{who:'El tesorero del partido',look:{jacket:'#3b3631',shirt:'#e9e2d0',tie:'#111',pants:'#2b2723',beard:'bigotito'},ch:1,ask:'La caja está vacía. Hay tres comerciantes simpatizantes que podrían aportar algo. ¿Va usted a verles?'},
  proteger:{who:'El dueño de un café',look:{jacket:'#e9e2d0',shirt:'#e9e2d0',tie:'#111',pants:'#1d1d1d',beard:'bigote'},ch:2,ask:'Unos matones vienen cada tarde a romperme el local porque dejo que ustedes se reúnan aquí. Hoy vuelven. ¿Me ayuda?'},
  mensaje:{who:'Un enlace',look:{jacket:'#5a6a4a',shirt:'#e9e2d0',pants:'#4a5a3c',hat:'fedora',hatC:'#3a322b'},ch:2,ask:'Este sobre tiene que llegar a su destino antes de que cambien la guardia. Nadie puede verlo. ¿Lo lleva usted?'},
  herido:{who:'Una camarada',look:{fem:1,shirt:'#2f4a7a',pants:'#2b2b3a',badge:1,hair:'largo'},ch:2,ask:'¡Han herido a Paco en una reyerta! Hay que llevarlo a la casa de socorro, pero solo no puede andar. ¿Le acompaña?'}};
function sidePoint(near,dmin,dmax){for(let k=0;k<200;k++){const [bi,bj]=CD.randBlock(),q=CD.ringPt(bi,bj,rnd(0,140),W.BS/2-1.5),d=Math.hypot(q.x-near.x,q.z-near.z);if(d>=dmin&&d<=dmax)return q;}return CD.ringPt(0,0,0,W.BS/2-1.5);}
function spawnGiver(){const ch=G.st.ch,pool=Object.keys(TYPES).filter(k=>TYPES[k].ch<=ch&&!SIDE.givers.some(g=>g.type===k));if(!pool.length)return;
  const type=pick(pool),tp=TYPES[type],q=sidePoint(PL.g.position,40,110),a=agent(tp.look,q.x,q.z,{yaw:q.out+Math.PI});SIDE.givers.push({type,a,x:q.x,z:q.z,sp:icon('?','#c9a84a',q.x,2.6,q.z),pt:Object.assign(mapPt(q.x,q.z,'#c9a84a'),{side:true})});}
function delGiver(gv){agDel(gv.a);delIcon(gv.sp);const i=CD.mapPts.indexOf(gv.pt);if(i>=0)CD.mapPts.splice(i,1);SIDE.givers.splice(SIDE.givers.indexOf(gv),1);}
const nearGiver=()=>{const p=PL.g.position;return SIDE.givers.find(g=>Math.hypot(g.x-p.x,g.z-p.z)<2.4);};
CD.addInteract(25,{test(){if(CD.interior||MIS.on||SIDE.act)return null;const g=nearGiver();return g?'Hablar con '+TYPES[g.type].who.charAt(0).toLowerCase()+TYPES[g.type].who.slice(1):null;},
  async act(){const gv=nearGiver();if(!gv)return;G.busy=true;const tp=TYPES[gv.type];await CD.UI.say(tp.who,tp.ask);const c=await CD.UI.choose('¿Aceptas el encargo?',['Aceptar','Ahora no'],{who:'Tú'});G.busy=false;
    if(c===0){delIcon(gv.sp);gv.sp=null;gv.pt.done=true;startSide(gv.type,gv);}}});
function endSide(ok,msg,fx,log){const s=SIDE.act;if(!s)return;for(const a of s.ags||[])agDel(a);for(const sp of s.sps||[])delIcon(sp);for(const p of s.pts2||[]){const i=CD.mapPts.indexOf(p);if(i>=0)CD.mapPts.splice(i,1);}
  if(s.giver&&SIDE.givers.includes(s.giver))delGiver(s.giver);SIDE.act=null;SIDE.onDown=null;CD.bar();CD.help(msg,4000);if(fx)CD.api.fx(fx);CD.sfx(ok?'good':'bad');
  if(ok){G.st.f.encargos=(G.st.f.encargos|0)+1;if(log)CD.logOnce('enc_'+s.type,log);}SIDE.cool=rnd(25,50);}
function startSide(type,giver){
  const s={type,giver,ags:[],sps:[],pts2:[],t:0},p=PL.g.position,pt=(q,col)=>{const m=mapPt(q.x,q.z,col||'#e0b33a');s.pts2.push(m);return m;};SIDE.act=s;
  SIDE.onDown=()=>endSide(false,'Te dan una paliza y tienes que retirarte.',{cordura:-4,prestigio:-2});
  if(type==='carteles'){s.tl=150;s.pts=[];for(let i=0;i<4;i++){const q=sidePoint(p,25,120);q.m=pt(q);s.sps.push(icon('C','#b3261e',q.x,2.4,q.z,.9));s.pts.push(q);}s.hold=0;}
  if(type==='fondos'){s.tl=200;s.got=0;s.pts=[];for(let i=0;i<3;i++){const q=sidePoint(p,30,130);q.a=agent({shirt:'#e9e2d0',jacket:'#6b5a48',pants:'#3a3028',beard:pick(['bigote','nada'])},q.x,q.z,{yaw:q.out+Math.PI});s.ags.push(q.a);q.m=pt(q);s.sps.push(icon('€','#c9a84a',q.x,2.6,q.z,.9));s.pts.push(q);}}
  if(type==='proteger'){s.tl=150;s.q=sidePoint(p,40,110);pt(s.q,'#e0503a');s.sps.push(icon('!','#b3261e',s.q.x,2.8,s.q.z));}
  if(type==='mensaje'){s.tl=75;s.q=sidePoint(p,110,200);pt(s.q);s.sps.push(icon('S','#2f4a7a',s.q.x,2.6,s.q.z));}
  if(type==='herido'){s.tl=140;s.q=sidePoint(p,70,140);pt(s.q,'#9fc47a');s.sps.push(icon('+','#2f7a4a',s.q.x,2.8,s.q.z));s.w=agent({shirt:'#34507f',pants:'#3a3028',badge:1},p.x+1,p.z+1);s.ags.push(s.w);s.trail=[];}
}
CD.on('update',dt=>{
  if(G.mode!=='game'||!G.st)return;
  for(const gv of SIDE.givers){if(gv.sp)gv.sp.visible=!CD.interior;gv.a.m.visible=!CD.interior;agAnim(gv.a,dt);gv.a.yaw=angLerp(gv.a.yaw,Math.atan2(PL.g.position.x-gv.x,PL.g.position.z-gv.z),Math.min(1,dt*3));}
  if(!CD.interior&&!MIS.on&&!G.busy){SIDE.cool-=dt;if(SIDE.cool<=0&&SIDE.givers.length<2&&!SIDE.act){SIDE.cool=rnd(30,60);spawnGiver();}for(const gv of SIDE.givers.slice())if(!SIDE.act&&Math.hypot(gv.x-PL.g.position.x,gv.z-PL.g.position.z)>220)delGiver(gv);}
  const s=SIDE.act;if(!s||G.busy||CD.interior||MIS.on)return;s.tl-=dt;const p=PL.g.position;
  if(s.type==='carteles'){const q=s.pts.find(q=>!q.done&&Math.hypot(q.x-p.x,q.z-p.z)<2);
    if(q&&K.use){s.hold+=dt;if(s.hold>1.4){q.done=true;q.m.done=true;delIcon(s.sps[s.pts.indexOf(q)]);s.hold=0;CD.sfx('paper',p);
      if(CD.actors.some(a=>a.kind==='cop'&&!a.dead&&Math.hypot(a.g.position.x-p.x,a.g.position.z-p.z)<18)){CD.api.fx({policia:2});CD.help('Un guardia te ha visto pegando el cartel.',2500);}}}else s.hold=0;
    const n=s.pts.filter(q=>q.done).length;CD.bar('Encargo: pegar carteles',q?'Mantén E pulsado para pegar el cartel':`Carteles ${n}/4 · ${Math.ceil(s.tl)} s`,q?s.hold/1.4:n/4);
    if(n>=4)endSide(true,'Carteles pegados. Mañana todo el barrio los verá.',{partido:3,apoyo:2,juventud:1,policia:1},'Pegaste carteles del partido por el centro.');else if(s.tl<=0)endSide(false,'No te ha dado tiempo a pegar todos los carteles.',{partido:-1});}
  else if(s.type==='fondos'){const q=s.pts.find(q=>!q.done&&Math.hypot(q.x-p.x,q.z-p.z)<2.2);
    if(q&&P.use&&!G.busy){q.done=true;q.m.done=true;delIcon(s.sps[s.pts.indexOf(q)]);(async()=>{G.busy=true;
      const c=await CD.UI.choose('El comerciante te mira con desconfianza: «¿Cuánto necesitan esta vez?».',['Pedírselo con buenas palabras','Presionarle: «Más le vale colaborar»','Dejarlo estar'],{who:'Un comerciante'});
      if(c===0){const v=Math.random()<.35+G.st.s.prestigio/200?4:1;s.got+=v;await CD.UI.say('Un comerciante',v>2?'Tome. Y que sirva para algo.':'Es lo que puedo dar, de verdad.');}
      else if(c===1){s.got+=5;CD.api.fx({policia:3,apoyo:-2,moderacion:-2});await CD.UI.say('Un comerciante','...Tome. Y no vuelvan por aquí.');}G.busy=false;})();}
    const n=s.pts.filter(q=>q.done).length;CD.bar('Encargo: recaudar fondos',q?'Pulsa E para hablar con el comerciante':`Visitados ${n}/3 · Recaudado ${s.got} · ${Math.ceil(s.tl)} s`,n/3);
    if(n>=3&&!G.busy)endSide(true,`Has recaudado ${s.got} para la caja del partido.`,{fondos:s.got},'Recaudaste fondos entre los comerciantes.');else if(s.tl<=0)endSide(false,'Se acabó el tiempo. La caja sigue vacía.',{partido:-1});}
  else if(s.type==='proteger'){const d=Math.hypot(s.q.x-p.x,s.q.z-p.z);
    if(!s.foes&&d<22){s.foes=[];for(let i=0;i<3;i++){const a=target(agent({shirt:pick(['#d8d0bf','#5b4a3a']),pants:'#3f4652',hat:'gorra',hatC:'#4a4038',beard:pick(['nada','barba'])},s.q.x+rnd(-3,3),s.q.z+rnd(-3,3)));s.ags.push(a);s.foes.push(a);}CD.help('¡Ahí están! Échalos (Q / Golpe).',2500);}
    if(s.foes){fighters(s.foes,dt,[5,8]);const left=s.foes.filter(a=>a.st!=='down').length;CD.bar('Encargo: proteger el café',`Matones en pie: ${left} · Salud ${Math.round(PL.hp)}`,1-left/3);
      if(!left)endSide(true,'Los matones huyen. El dueño del café te estrecha la mano: «Aquí siempre tendrán sitio».',{fondos:5,partido:2,juventud:2,policia:2,moderacion:-2},'Defendiste a puñetazos un café afín.');}
    else CD.bar('Encargo: proteger el café',`Ve al café marcado · ${Math.ceil(s.tl)} s`);
    if(SIDE.act&&s.tl<=0)endSide(false,'Llegas tarde: el café está destrozado.',{partido:-2});}
  else if(s.type==='mensaje'){const d=Math.hypot(s.q.x-p.x,s.q.z-p.z);CD.bar('Encargo: entregar un mensaje',`Destino a ${Math.round(d)} m · ${Math.ceil(s.tl)} s`,1-s.tl/75);
    if(d<2.2)endSide(true,'Sobre entregado. «Dígale al jefe que todo sigue en marcha».',G.st.ch>=3?{militares:3,prestigio:1}:{partido:2,prestigio:1},'Hiciste de correo para la organización.');else if(s.tl<=0)endSide(false,'Llegas tarde. El enlace ya no está.',{militares:-1});}
  else if(s.type==='herido'){const w=s.w,lt=s.trail[s.trail.length-1];if(!lt||Math.hypot(lt.x-p.x,lt.z-p.z)>.8){s.trail.push({x:p.x,z:p.z});if(s.trail.length>60)s.trail.shift();}
    const tg=s.trail[Math.max(0,s.trail.length-4)]||p;agMove(w,tg.x,tg.z,2.4,dt,1.2);agAnim(w,dt);const d=Math.hypot(s.q.x-w.m.position.x,s.q.z-w.m.position.z);
    if(!s.foes&&s.tl<90){s.foes=[];for(let i=0;i<2;i++){const a=target(agent({shirt:'#d8d0bf',pants:'#3a3a3a',tie:'#c0392b',hat:'boina',hatC:'#222'},p.x+rnd(-12,12),p.z+rnd(-12,12)));s.ags.push(a);s.foes.push(a);}CD.help('¡Emboscada! Protege al herido.',2500);}
    if(s.foes)fighters(s.foes,dt,[5,8]);CD.bar('Encargo: acompañar al herido',`Casa de socorro a ${Math.round(d)} m · ${Math.ceil(s.tl)} s`,1-d/150);
    if(d<2.5)endSide(true,'Llegáis a la casa de socorro. Paco se salvará.',{partido:3,cordura:2},'Llevaste a un camarada herido a la casa de socorro.');else if(s.tl<=0)endSide(false,'No habéis llegado a tiempo.',{partido:-2,cordura:-3});}
});
const clearSide=()=>{if(SIDE.act){for(const a of SIDE.act.ags||[])agDel(a);for(const sp of SIDE.act.sps||[])delIcon(sp);SIDE.act=null;}for(const g of SIDE.givers.slice())delGiver(g);clearPts();for(let i=CD.mapPts.length-1;i>=0;i--)if(CD.mapPts[i].side)CD.mapPts.splice(i,1);CD.bar();};
for(const ev of ['chapter','gameStart','ending','toTitle'])CD.on(ev,clearSide);
})();
</script>

<script id="voces">
/* =====================================================================
   CARA AL DESTINO · MEJORA · VOCES (v3)
   Murmullo programado en el motor de audio, o voz del navegador
   ===================================================================== */
(function(){
'use strict';
const CD=window.CD;if(!CD||!CD.UI)return;
const SS=window.speechSynthesis,G=CD.G,UI=CD.UI,AU=CD.AU;

// ---------- ajustes ----------
if(typeof CD.SET.voz!=='string')CD.SET.voz=CD.SET.voz===0?'no':'murmullo';
for(const [k,v] of [['vozvol',1],['vozvel',1.15],['vozauto',0]])if(CD.SET[k]===undefined)CD.SET[k]=v;
if(CD.SET.vozvel<1)CD.SET.vozvel=1.15;if(!CD.SET.vozvol)CD.SET.vozvol=1;CD.saveSet();
CD.settingsRows=CD.settingsRows.filter(r=>!['voz','vozvol','vozvel','vozauto','voztest'].includes(r.k));
CD.settingRow({g:'Sonido',k:'voz',t:'Voces',o:[['murmullo','Murmullo (tipo Sims)'],['natural','Voz del navegador'],['no','Sin voz']],on:()=>{stopAll();setTimeout(demo,150);}});
CD.settingRow({g:'Sonido',k:'voztest',t:'Probar las voces',o:[['x','▶ Probar']],on:()=>{CD.SET.voztest=null;CD.saveSet();setTimeout(demo,150);}});
CD.settingRow({g:'Sonido',k:'vozvol',t:'Volumen de las voces',o:CD.VOL});
CD.settingRow({g:'Sonido',k:'vozvel',t:'Velocidad de la voz del navegador',o:[[1,'Normal'],[1.15,'Ágil'],[1.3,'Rápida']]});
CD.settingRow({g:'Sonido',k:'vozauto',t:'Avanzar solo al terminar de hablar',o:[[0,'No'],[1,'Sí']]});

// ---------- quién habla ----------
const FEM=/pilar|carmen|mujer|señora|una camarada|viuda|madre|marquesa|camarera|chica|muchacha/i;
const NARR=/^(narrador|mitin|situación|tu propia voz|una carta sin firma|decisión urgente)$/i;
const CROWD=/^(público|publico)$/i,PJ=/^(tú|jose antonio|josé antonio|elige tu tema)$/i;
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h);};
const kind=who=>{const w=String(who||'');return !w||NARR.test(w)?'narr':CROWD.test(w)?'crowd':PJ.test(w)?'pj':FEM.test(w)?'f':'m';};

// =====================================================================
//  MURMULLO
// =====================================================================
const MUR=new Map();
function murProf(who){
  const k=String(who||'');if(MUR.has(k))return MUR.get(k);const h=hash(k),t=kind(who);
  const p=t==='narr'?{base:100,gap:.1,len:.08,var:.22,wave:'triangle'}
    :t==='pj'?{base:130,gap:.082,len:.07,var:.3,wave:'triangle'}
    :t==='f'?{base:210+(h%6)*9,gap:.072+(h%3)*.006,len:.06,var:.36,wave:'triangle'}
    :{base:112+(h%7)*7,gap:.078+(h%3)*.007,len:.066,var:.32,wave:(h%2)?'triangle':'square'};
  MUR.set(k,p);return p;
}
let bus=null,murActive=false;
function newBus(){const a=AU.ctx;if(bus)try{bus.gain.setTargetAtTime(0,a.currentTime,.02);}catch(e){}bus=a.createGain();bus.gain.value=1;bus.connect(AU.sfx);return bus;}
function fadeBus(){if(bus&&AU.ctx)try{bus.gain.setTargetAtTime(0,AU.ctx.currentTime,.03);}catch(e){}murActive=false;}
function blipAt(b,t0,p,f,len){
  const a=AU.ctx,g=.09*CD.SET.vozvol*(p.wave==='square'?.45:1);
  const o=a.createOscillator(),e=a.createGain();o.type=p.wave;o.frequency.setValueAtTime(f,t0);o.frequency.linearRampToValueAtTime(f*(1+(Math.random()-.5)*.14),t0+len);
  e.gain.setValueAtTime(.0001,t0);e.gain.exponentialRampToValueAtTime(g,t0+.012);e.gain.exponentialRampToValueAtTime(.0001,t0+len);o.connect(e).connect(b);o.start(t0);o.stop(t0+len+.03);
  const o2=a.createOscillator(),e2=a.createGain();o2.type='sine';o2.frequency.setValueAtTime(f*2.01,t0);e2.gain.setValueAtTime(.0001,t0);e2.gain.exponentialRampToValueAtTime(g*.35,t0+.01);e2.gain.exponentialRampToValueAtTime(.0001,t0+len*.8);
  o2.connect(e2).connect(b);o2.start(t0);o2.stop(t0+len+.03);
}
function murmur(who,text){
  const a=AU.ctx;if(!a)return 0;if(a.state==='suspended')a.resume();
  const b=newBus(),p=murProf(who),txt=String(text),t0=a.currentTime+.06,cps=55;let next=0,last=0;
  for(let i=0;i<txt.length&&i<cps*25;i++){
    const ch=txt[i],tc=i/cps;if(/\s/.test(ch))continue;if(/[.,;:—…]/.test(ch)){next=Math.max(next,tc+.14);continue;}if(/[!?¡¿"«»]/.test(ch))continue;
    if(tc<next)continue;const seg=txt.slice(Math.max(0,i-30),i+30),excl=/[!¡]/.test(seg),quest=/[?¿]/.test(txt.slice(i,i+12));
    const f=p.base*(1+(Math.random()-.5)*p.var+(excl?.12:0)+(quest?.07:0)),len=p.len*(.8+Math.random()*.5);
    blipAt(b,t0+tc,p,f,len);next=tc+p.gap*(.85+Math.random()*.35);last=tc;}
  murActive=true;return last+.3;
}

// =====================================================================
//  VOZ DEL NAVEGADOR
// =====================================================================
let voices=[];
const MALEV=/pablo|jorge|diego|juan|alvaro|álvaro|enrique|carlos|miguel|andr[eé]s|ra[uú]l|antonio|manuel|dario|darío|male/i;
const FEMV=/helena|laura|m[oó]nica|elvira|luc[ií]a|paulina|sabina|conchita|pen[eé]lope|lupe|esperanza|marisol|isabel|ximena|abril|google español|female/i;
const vScore=v=>(/natural|neural|online/i.test(v.name)?6:0)+(/google/i.test(v.name)?3:0)+(v.lang==='es-ES'?2:0);
const PROF=new Map();
function loadVoices(){if(!SS)return;voices=SS.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>vScore(b)-vScore(a));PROF.clear();}
const gender=v=>MALEV.test(v.name)?'m':FEMV.test(v.name)?'f':'?';
function profile(who){
  const k=String(who||'');if(PROF.has(k))return PROF.get(k);const h=hash(k),t=kind(who),want=t==='f'?'f':'m';
  const same=voices.filter(v=>gender(v)===want),pool=same.length?same:voices;
  const v=(t==='narr'||t==='pj')?(same[0]||voices[0]||null):(pool[h%Math.max(1,Math.min(pool.length,3))]||null);
  const shift=!same.length&&voices.length?(want==='f'?1.18:.88):1;
  const p={v,pitch:shift*(t==='narr'?.97:t==='pj'?1:1+((h%5)-2)*.025),rate:t==='narr'?.98:1.02};PROF.set(k,p);return p;
}
let token=0,pjSpeaking=false;
const clean=t=>String(t).replace(/[«»"“”]/g,'').replace(/\s*\(([^)]*)\)/g,'').replace(/…/g,'...').trim();
function speakTTS(who,text,o={}){
  if(!SS||!text)return;if(!voices.length)loadVoices();const isPJ=kind(who)==='pj';if(!o.queue&&!pjSpeaking)SS.cancel();
  const p=profile(who),my=++token,parts=clean(text).split(/(?<=[.!?;:])\s+/).filter(s=>s.trim());if(isPJ)pjSpeaking=true;
  parts.forEach((s,i)=>{const u=new SpeechSynthesisUtterance(s);if(p.v){u.voice=p.v;u.lang=p.v.lang;}else u.lang='es-ES';
    u.pitch=Math.max(.5,Math.min(1.6,p.pitch));u.rate=Math.max(.7,Math.min(2,p.rate*CD.SET.vozvel));u.volume=Math.max(0,Math.min(1,CD.SET.vozvol*CD.SET.vol));
    if(i===parts.length-1)u.onend=u.onerror=()=>{if(isPJ)pjSpeaking=false;autoNext(my);};SS.speak(u);});
}
if(SS){loadVoices();if('onvoiceschanged' in SS)SS.onvoiceschanged=loadVoices;}

// =====================================================================
//  CONEXIÓN CON LOS DIÁLOGOS
// =====================================================================
function stopAll(){token++;fadeBus();pjSpeaking=false;if(SS)SS.cancel();}
function autoNext(my){if(!CD.SET.vozauto)return;setTimeout(()=>{if(my===token&&UI.mode==='say'&&!G.paused){UI.shown=UI.full.length;UI.done();}},700);}
CD.on('say',(who,text)=>{
  const k=kind(who);if(k==='crowd'||CD.SET.voz==='no')return;
  if(CD.SET.voz==='natural'){speakTTS(who,text,{queue:pjSpeaking});return;}
  const dur=murmur(who,text),my=++token;if(CD.SET.vozauto)setTimeout(()=>autoNext(my),Math.max(dur,String(text).length/55)*1000+400);
});

}

const hasLog=(st,re)=>st.log.some(l=>re.test(l));

  campo:st=>['Mitin en un pueblo de Castilla',(st.f.mit_campesinos||.4)>=.55?'Los jornaleros escuchan con interés.':'Frialdad en la plaza.'],
  elecciones:st=>st.f.acta?['Conserva su escaño','Uno de los pocos éxitos de la candidatura.']:['Falange se queda sin representación','Apenas unas decenas de miles de votos en toda España.'],

  3:['Escándalo del estraperlo','El caso de corrupción sacude al Gobierno de radicales y cedistas.'],4:['Gana el Frente Popular','Nuevo Gobierno de izquierdas tras unas elecciones muy reñidas.']};
const LOGN=[[/Mataste a un guardia/,'Asesinado un guardia de asalto','La policía busca al jefe de Falange.',3],[/Mataste a una persona/,'Muere un transeúnte en un altercado','Testigos señalan a un dirigente político.',3],
  [/Mataste a un militante/,'Muerte en una reyerta política','Otro episodio de la violencia entre grupos rivales.',3],[/Dejaste inconsciente|Agrediste/,'Altercado en plena calle','Un dirigente de Falange, envuelto en una pelea.',2],
  [/grupo rival/,'Reyerta entre militantes rivales','Golpes y carreras en pleno centro.',2],[/Disparaste/,'Disparos en el centro de Madrid','Pánico entre los transeúntes.',2],

const om=CD.runMitin;CD.runMitin=async(a,o)=>{const sc=await om(a,o);if(G.st){G.st.f['mit_'+a]=sc;if(a!=='burgueses'&&a!=='campesinos')pushNews(sc>=.6?`Éxito del mitin en ${AUDN[a]||'un teatro'}`:sc>=.4?`Mitin sin sobresaltos en ${AUDN[a]||'un teatro'}`:`Fracaso del mitin en ${AUDN[a]||'un teatro'}`,sc>=.6?'Larga ovación al terminar.':'El público se marcha murmurando.');}return sc;};
const oa=CD.runAction;CD.runAction=async n=>{const sc=await oa(n);if(G.st){const N={reparto:[sc>=.6?'«Arriba» amanece en todos los portales':'Requisados ejemplares de «Arriba»',sc>=.6?'Un reparto nocturno burla a la policía.':'La policía intercepta parte de la tirada.'],

  tribuna:[sc>=.5?'Incidentes en un mitin en Cádiz':'Batalla campal en un mitin','Objetos lanzados contra la tribuna.']}[n];if(N)pushNews(N[0],N[1],2);}return sc;};
CD.on('eventEnd',id=>{const f=EVN[id];if(!f||!G.st)return;const r=f(G.st);if(r)pushNews(r[0],r[1],2);});

  for(let i=0;i<2;i++){const [bi,bj]=CD.randBlock(),q=CD.ringPt(bi,bj,rnd(0,140),W.BS/2-1.2),m=CD.makeHuman({shirt:'#d8d0bf',pants:'#4a3f33',hat:'gorra',hatC:'#3a3a3a',skin:pick(CD.SKINS)});
    m.position.set(q.x,.2,q.z);m.rotation.y=q.out;scene.add(m);const bundle=new T.Mesh(CD.BOX,CD.mat('#efe6cf'));bundle.scale.set(.35,.2,.25);bundle.position.set(.2,1.1,.25);m.add(bundle);VOC.push({m,t:rnd(2,8)});}}
CD.addInteract(21,{test(){if(CD.interior||!G.st)return null;const p=PL.g.position;return VOC.some(v=>Math.hypot(v.m.position.x-p.x,v.m.position.z-p.z)<2.2)?'Comprar el periódico al voceador':null;},act(){CD.showPaper();}});
CD.on('update',dt=>{if(G.mode!=='game'||!G.st||CD.interior)return;const p=PL.g.position;
  for(const v of VOC){v.m.visible=CD.city.visible;const u=v.m.userData;u.armOverride=true;u.armR.rotation.x=-1.2+Math.sin(G.time*3+v.t)*.4;
    v.t-=dt;if(v.t<=0&&Math.hypot(v.m.position.x-p.x,v.m.position.z-p.z)<12){v.t=rnd(14,20);const n=(G.st.f.news||[])[0];if(n){CD.help(`Un voceador: «¡Extra, extra! ¡${n.h}!»`,3500);CD.tone(380,.18,{g:.05,type:'triangle',slide:120,pos:v.m.position});CD.tone(450,.22,{g:.05,type:'triangle',delay:.2,slide:-80,pos:v.m.position});}}}});

// =====================================================================
//  2. LA GENTE TE RECONOCE
// =====================================================================
const BUB=[];
function bubbleTex(text){return CD.ctex(256,64,x=>{x.fillStyle='rgba(239,230,207,.95)';x.beginPath();x.moveTo(12,4);x.lineTo(244,4);x.quadraticCurveTo(252,4,252,12);x.lineTo(252,44);x.quadraticCurveTo(252,52,244,52);
  x.lineTo(40,52);x.lineTo(28,62);x.lineTo(30,52);x.lineTo(12,52);x.quadraticCurveTo(4,52,4,44);x.lineTo(4,12);x.quadraticCurveTo(4,4,12,4);x.fill();
  x.fillStyle='#1d1813';let fs=24;x.font=`italic ${fs}px Georgia, serif`;while(x.measureText(text).width>232&&fs>12){fs--;x.font=`italic ${fs}px Georgia, serif`;}x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,29);});}
function bubble(obj,text){const s=new T.Sprite(new T.SpriteMaterial({map:bubbleTex(text),depthTest:false,transparent:true}));s.scale.set(2.4,.6,1);s.renderOrder=997;scene.add(s);BUB.push({s,obj,t:2.8});}
const zone=x=>{const i=Math.floor((x+W.HALF-W.RW)/W.P);return i<=1?'rico':i>=4?'obrero':'centro';};
function attitude(z){const s=G.st.s,f=G.st.f;let a=(s.apoyo-30)/40+(s.prestigio-40)/80-(f.violencia|0)/20;
  if(z==='rico')a+=(s.derecha-30)/50-s.izquierda/60;if(z==='obrero')a+=s.izquierda/40-(s.derecha-20)/50-.5;return a;}
const PHR={pos:['¡Ánimo, jefe!','Es él, el del teatro…','Buenas tardes, don José Antonio.','Le vi en el mitin. Muy bien dicho.','¡Adelante, que tiene usted razón!'],

  const s=G.st.s,f=G.st.f,fame=(s.apoyo+s.prestigio)/2+(f.violencia|0)*3,p=PL.g.position;if(Math.random()>fame/140)return;
  const cands=CD.peds.filter(q=>!q.custom&&q.g.visible&&!q.reacted&&Math.hypot(q.g.position.x-p.x,q.g.position.z-p.z)<6);if(!cands.length)return;

  const a=attitude(zone(q.g.position.x)),list=(f.violencia|0)>8&&Math.random()<.5?PHR.viol:a>.3?PHR.pos:a<-.3?PHR.neg:PHR.neu;
  bubble(q.g,pick(list));const u=q.g.userData;u.armOverride=true;u.armR.rotation.x=list===PHR.pos?-1.5:list===PHR.neu?-.3:-1.2;

const PTX={};

const WALL=[];const PG=new T.PlaneGeometry(1,1);

  for(let i=0;i<60&&cols.length;i++){const c=cols[Math.floor(r()*cols.length)],f=c.face,along=f==='pz'||f==='nz';
    const s=along?lerp(c.x0+1,c.x1-1,r()):lerp(c.z0+1,c.z1-1,r()),y=3.3;let x,z,ry;
    if(f==='pz'){x=s;z=c.z1-.07;ry=0;}else if(f==='nz'){x=s;z=c.z0+.07;ry=Math.PI;}else if(f==='px'){x=c.x1-.07;z=s;ry=Math.PI/2;}else{x=c.x0+.07;z=s;ry=-Math.PI/2;}
    const m=new T.Mesh(PG,new T.MeshLambertMaterial({transparent:true,side:T.DoubleSide}));m.position.set(x,y,z);m.rotation.y=ry;m.visible=false;m.userData.rv=r();CD.city.add(m);WALL.push(m);}}
function refreshWalls(){if(!G.st||!WALL.length)return;const s=G.st.s,ch=G.st.ch,f=G.st.f;
  const own=clamp(.15+s.partido/150+(f.lg_enc_carteles?.15:0),.1,.75),rivalPool=ch>=4?['fp','uhp','nopas','cnt','repv','ceda']:ch>=3?['uhp','cnt','ceda','repv','fp']:ch>=2?['uhp','cnt','ceda','repv']:['ceda','repv','cnt'];

let lastP=-1,wT=0;

for(const ev of ['chapter','gameStart','eventEnd'])CD.on(ev,()=>{lastP=-1;wT=0;if(ev!=='eventEnd')spawnVoc();});

// =====================================================================
//  4. PERSONAJES RECURRENTES

const REC=[
  {key:'julian',name:'Julián Arce',look:()=>CD.LOOKS.julian,cond:st=>st.f.julian!=null||st.ch>=2,
    async talk(st){const f=st.f,UI=CD.UI;

      else if(c===2){CD.api.fx({coherencia:2,cordura:-2});f.julian=0;await UI.say('Julián Arce','Pues nada. Ya sé de qué lado estás.');}
      else await UI.say('Julián Arce','Como quieras. Cuídate.');}},
  {key:'carmen',name:'Carmen Ibáñez',look:()=>CD.LOOKS.carmen,cond:st=>st.ch>=2,
    async talk(st){const UI=CD.UI,s=st.s,f=st.f;
      const line=(f.violencia|0)>6?'Jefe, la gente habla de lo de la otra noche. A unos les ha gustado; a otros los ha asustado. Hay que tener cuidado con la prensa.'

];
let recCool=90,recNow=null;
CD.addInteract(28,{test(){if(!recNow||recNow.st!=='wait'||CD.interior)return null;const p=PL.g.position,q=recNow.m.position;return Math.hypot(q.x-p.x,q.z-p.z)<2.4?'Hablar con '+recNow.def.name:null;},
  async act(){const r=recNow;if(!r)return;G.busy=true;r.st='talk';const sp=r.sp;if(sp&&sp.parent)sp.parent.remove(sp);
    try{await r.def.talk(G.st);}catch(e){console.error(e);}G.busy=false;r.st='leave';r.t=0;}});
function recSprite(){return new T.Sprite(new T.SpriteMaterial({map:CD.ctex(64,64,x=>{x.fillStyle='#efe4c8';x.beginPath();x.arc(32,32,30,0,7);x.fill();x.fillStyle='#2f4a7a';x.beginPath();x.arc(32,32,25,0,7);x.fill();
  x.fillStyle='#efe4c8';x.font='700 36px Oswald, Impact, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('!',32,35);}),depthTest:false}));}

  if(G.mode!=='game'||!G.st)return;

    q.x+=Math.sin(r.yaw)*spd*dt;q.z+=Math.cos(r.yaw)*spd*dt;CD.collide(q,.35);q.y=CD.groundY(q.x,q.z);m.rotation.y=r.yaw;CD.animHuman(m,spd,dt);return;}

  const f=G.st.f,opts=REC.filter(d=>d.cond(G.st)&&!f['rec_'+d.key+G.st.ch]);if(!opts.length)return;const def=pick(opts);f['rec_'+def.key+G.st.ch]=1;
  const p=PL.g.position,a=Math.random()*Math.PI*2,q={x:p.x+Math.cos(a)*18,z:p.z+Math.sin(a)*18};CD.collide(q,.4);
  const m=CD.makeHuman(Object.assign({skin:'#e2b38e'},def.look()));m.position.set(q.x,CD.groundY(q.x,q.z),q.z);scene.add(m);const sp=recSprite();sp.scale.set(.9,.9,1);sp.renderOrder=998;scene.add(sp);
  recNow={def,m,sp,st:'come',t:0,yaw:Math.atan2(p.x-q.x,p.z-q.z)};CD.help(`${def.name} viene hacia ti.`,3000);
});
for(const ev of ['chapter','gameStart','ending','toTitle'])CD.on(ev,clearRec);
CD.on('hideCity',h=>{if(recNow){recNow.m.visible=!h;if(recNow.sp)recNow.sp.visible=!h;}for(const v of VOC)v.m.visible=!h;});
CD.on('init',buildWalls);
})();

<script id="madrid">

  // Puerta del Sol: Casa de Correos con su reloj
  const zc=cz-W.BS/2+3;box('#c97a5a',24,9,5,cx,4.7,zc,true);box('#e3d6b8',24.6,.5,5.6,cx,9.4,zc);box('#c97a5a',5,4,4.5,cx,11.6,zc);box('#e3d6b8',5.4,.4,4.9,cx,13.8,zc);
  for(let i=-5;i<=5;i++)if(i)box('#2b3040',1.1,1.8,.1,cx+i*2.1,5.5,zc+2.52);box('#4d3019',2.2,3.2,.1,cx,1.8,zc+2.52);

  for(let y=4;y<44;y+=3.6)for(const s of [-1,1]){box('#2b3040',6,1.8,.08,tx,y,tz+s*4.52);box('#2b3040',.08,1.8,6,tx+s*4.52,y,tz);}
  LAND.push({n:'Telefónica',x:tx,z:tz});
  // Cibeles, en un cruce al este
  const ix=W.rc(Math.min(W.N,W.PLAZA[0]+3)),iz=W.rc(W.PLAZA[1]+1);
  const base=CD.sh(new T.Mesh(new T.CylinderGeometry(2.2,2.4,.6,8),M('#a69a86')));base.position.set(ix,.3,iz);g.add(base);
  const water=new T.Mesh(new T.CylinderGeometry(2,2,.1,8),M('#6fa0b8'));water.position.set(ix,.62,iz);g.add(water);
  box('#c9c2b0',1.4,1,2.2,ix,1.3,iz);box('#c9c2b0',.5,.6,.9,ix-.45,1.1,iz+1.4);box('#c9c2b0',.5,.6,.9,ix+.45,1.1,iz+1.4);box('#d8d2c0',.5,1.4,.5,ix,2.4,iz-.2);box('#d8d2c0',.36,.36,.36,ix,3.3,iz-.2);

    if(b==='Lavapiés')for(let k=0;k<5;k++){const y=6+k*2.5,z=bz+W.BS/2-W.SW+.4,x0=bx-W.BS/2+4+k*5;BUF.box(buf,x0+2,y,z,4,.02,.02,'#3a3530');

CD.on('render',()=>{if(CD.solHand)CD.solHand.rotation.z=-(G.hour%12)/12*Math.PI*2;});

// =====================================================================
//  LLUVIA
// =====================================================================
const WX=CD.weather={rain:0,target:0,t:30};

CD.on('update',dt=>{
  if(G.mode!=='game')return;WX.t-=dt;if(WX.t<=0){WX.t=rnd(60,140);WX.target=Math.random()<.28?rnd(.5,1):0;if(WX.target>0)CD.help('Empieza a llover.',2500);}

    if(rp[k+4]<0||Math.abs(rp[k]-c.x)>30||Math.abs(rp[k+2]-c.z)>30){const x=c.x+rnd(-30,30),z=c.z+rnd(-30,30),y=c.y+rnd(5,22);rp[k]=x;rp[k+1]=y;rp[k+2]=z;rp[k+3]=x+.05;rp[k+4]=y-.7;rp[k+5]=z;}}
  rg.attributes.position.needsUpdate=true;
});
CD.on('render',()=>{if(CD.interior||WX.rain<.02)return;const k=1-.35*WX.rain;scene.background.multiplyScalar(k);scene.fog.color.multiplyScalar(k);scene.fog.far*=1-.4*WX.rain;CD.sun.intensity*=1-.6*WX.rain;});

// =====================================================================
let rT=0;
CD.on('update',dt=>{rT-=dt;if(rT>0||!CD.WK)return;rT=2;const late=G.night>.6||WX.rain>.6;
  CD.WK.list.forEach((w,i)=>{if(late&&i%3!==0&&w.mode!=='gone'){w.nightMode=w.mode;w.mode='gone';}else if(!late&&w.nightMode){w.mode=w.nightMode;w.nightMode=null;}});});

//  DESTINO MARCADO
// =====================================================================
let WP=null;
const wpBeam=new T.Mesh(new T.CylinderGeometry(1.2,1.2,40,10,1,true),new T.MeshBasicMaterial({color:'#b48ad8',transparent:true,opacity:.28,depthWrite:false,side:T.DoubleSide}));wpBeam.visible=false;scene.add(wpBeam);

//  MAPA COMPLETO

  x.fillStyle='#8f7a58';for(const b of CD.col)if(b.bld)x.fillRect(P(b.x0),P(b.z0),(b.x1-b.x0)*k,(b.z1-b.z0)*k);
  x.strokeStyle='#5a4630';x.lineWidth=2;x.strokeRect(P(-W.HALF),P(-W.HALF),W.HALF*2*k,W.HALF*2*k);
  x.fillStyle='rgba(90,70,45,.5)';x.textAlign='center';x.font=`italic 700 ${Math.round(28*k*1.6)}px Georgia, serif`;
  const seen={};for(let i=0;i<W.N;i++)for(let j=0;j<W.N;j++){const b=BARRIO(W.bc(i),W.bc(j));(seen[b]=seen[b]||[]).push([W.bc(i),W.bc(j)]);}

<script id="conducir">
/* =====================================================================
   CARA AL DESTINO · MEJORA · CONDUCIR POR MADRID
   Coches aparcados que se pueden usar, radio de época y taxis
   ===================================================================== */
(function(){
'use strict';
const CD=window.CD;if(!CD||!CD.makeCar||!CD.addCam)return;
const {T,L,clamp,rnd,pick,lerp,G,scene,cam,K,P,JOY,W,PL}=CD;

const DRV=CD.DRV={car:null,list:[],radio:true};
const COLS=['#2a2a2a','#3b2a20','#1d2a3a','#4a1f1a','#2f3f2a','#5a4a3a','#1a1a1a','#3a3a4a'];

const copSees=p=>(CD.actors||[]).some(a=>a.kind==='cop'&&!a.dead&&a.g.visible&&Math.hypot(a.g.position.x-p.x,a.g.position.z-p.z)<20);

// =====================================================================
//  COCHES APARCADOS
// =====================================================================
function spot(){
  for(let k=0;k<60;k++){const vert=Math.random()<.5,r=Math.floor(rnd(0,W.N+1)),along=rnd(-W.HALF+10,W.HALF-10),side=Math.random()<.5?-1:1,off=W.RW/2-1.4;
    const x=vert?W.rc(r)+side*off:along,z=vert?along:W.rc(r)+side*off;
    let ok=Math.abs(x)<W.HALF-4&&Math.abs(z)<W.HALF-4;
    for(const c of CD.col){if(x>c.x0-2.6&&x<c.x1+2.6&&z>c.z0-2.6&&z<c.z1+2.6){ok=false;break;}}
    for(const q of DRV.list)if(Math.hypot(q.x-x,q.z-z)<8)ok=false;
    if(ok)return {x,z,yaw:vert?(side>0?0:Math.PI):(side>0?Math.PI/2:-Math.PI/2)};}
  return null;
}
function spawnParked(n){
  for(let i=0;i<n;i++){const s=spot();if(!s)continue;const g=CD.makeCar(pick(COLS));g.position.set(s.x,CD.groundY(s.x,s.z),s.z);g.rotation.y=s.yaw;scene.add(g);
    const c={g,x:s.x,z:s.z,yaw:s.yaw,v:0,dmg:0,circ:{x:s.x,z:s.z,r:1.3}};CD.circ.push(c.circ);DRV.list.push(c);}
}
function clearParked(){for(const c of DRV.list){scene.remove(c.g);const i=CD.circ.indexOf(c.circ);if(i>=0)CD.circ.splice(i,1);}DRV.list=[];}
CD.on('hideCity',h=>{for(const c of DRV.list)c.g.visible=!h;});

// =====================================================================
//  SUBIR Y BAJAR
// =====================================================================
const near=()=>{const p=PL.g.position;let b=null,bd=2.8;for(const c of DRV.list){const d=Math.hypot(c.x-p.x,c.z-p.z);if(d<bd){bd=d;b=c;}}return b;};
CD.addInteract(45,{test(){if(DRV.car||CD.interior||(CD.TOWN&&CD.TOWN.cur)||(CD.MIS&&CD.MIS.on)||CD.inCar)return null;this.c=near();return this.c?'Subir al coche':null;},act(){enter(this.c);}});
CD.addInteract(99,{test(){return DRV.car?(Math.abs(DRV.car.v)<3?'Bajar del coche':'Frena para bajar'):null;},act(){if(DRV.car&&Math.abs(DRV.car.v)<3)leave();}});
let eng=null;
function engine(on){const A=CD.AU;if(on&&A.ctx&&!eng){const a=A.ctx,o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';f.type='lowpass';f.frequency.value=480;g.gain.value=.035;o.connect(f).connect(g).connect(A.sfx);o.start();eng={o,g};}
  if(!on&&eng){try{eng.o.stop();}catch(e){}eng=null;}}

  if(copSees(p)){crime(1,'Robaste un coche delante de la policía.');CD.help('¡Un guardia te ha visto llevarte el coche!',2500);}

  CD.help('W/S: acelerar y frenar · A/D: girar · Espacio: freno de mano · H: bocina · R: radio · E: bajar',4500);}
function leave(force){const c=DRV.car;if(!c)return;DRV.car=null;CD.inCar=false;CD.lockMove=false;PL.g.visible=true;engine(false);CD.bar();
  const sx=Math.cos(c.yaw)*1.9,sz=-Math.sin(c.yaw)*1.9,q={x:c.x+sx,z:c.z+sz};CD.collide(q,.4);CD.placePlayer(q.x,q.z,c.yaw);
  c.circ.x=c.x;c.circ.z=c.z;CD.circ.push(c.circ);c.v=0;CD.sfx('door');if(force)CD.help('El coche ha quedado inservible.',2500);}

// =====================================================================
//  CONDUCCIÓN
// =====================================================================
const _c=new T.Vector3(),_l=new T.Vector3();
CD.addCam(85,dt=>{const c=DRV.car;if(!c)return false;const fx=Math.sin(c.yaw),fz=Math.cos(c.yaw),back=7+Math.abs(c.v)*.12;
  _c.set(c.x-fx*back,3.2+Math.abs(c.v)*.03,c.z-fz*back);cam.position.lerp(_c,1-Math.exp(-dt*5));_l.set(c.x+fx*4,1.2,c.z+fz*4);cam.lookAt(_l);return true;});
let hornT=0;
CD.on('update',dt=>{
  const c=DRV.car;if(!c)return;
  if(G.paused||G.busy){c.v=lerp(c.v,0,dt*3);return;}
  if(CD.interior||(CD.MIS&&CD.MIS.on)){leave();return;}
  const thr=(K.up?1:0)-(K.down?1:0)-JOY.y,steer=(K.left?1:0)-(K.right?1:0)-JOY.x,hand=K.jump||K[' '];
  const maxv=c.dmg>=3?15:24;
  if(thr>.1)c.v+=thr*(c.v<0?14:8)*dt;else if(thr<-.1)c.v+=thr*(c.v>0?16:6)*dt;else c.v=lerp(c.v,0,dt*.5);

  c.yaw+=clamp(steer,-1,1)*(hand?2.2:1.6)*Math.min(1,Math.abs(c.v)/5)*Math.sign(c.v||1)*dt;

  if(Math.hypot(q.x-want.x,q.z-want.z)>.04&&Math.abs(c.v)>7){c.dmg++;c.v*=-.25;CD.sfx('crash',q);if(c.dmg===3)CD.help('El motor empieza a echar humo.',2000);}
  c.x=q.x;c.z=q.z;
  for(const o of CD.cars||[]){const op=o.g.position,d=Math.hypot(op.x-c.x,op.z-c.z);if(d<2.7){if(!o.hitDrv&&Math.abs(c.v)>5){c.dmg++;CD.sfx('crash',op);}o.hitDrv=1;c.v*=.3;const l=d||1;c.x+=(c.x-op.x)/l*.5;c.z+=(c.z-op.z)/l*.5;}else o.hitDrv=0;}
  for(const o of DRV.list){if(o===c)continue;const d=Math.hypot(o.x-c.x,o.z-c.z);if(d<2.6){if(Math.abs(c.v)>6){c.dmg++;CD.sfx('crash',o.g.position);}c.v*=.3;const l=d||1;c.x+=(c.x-o.x)/l*.5;c.z+=(c.z-o.z)/l*.5;}}
  const fx=Math.sin(c.yaw),fz=Math.cos(c.yaw);
  for(const pd of CD.peds||[]){if(!pd.g.visible)continue;const pp=pd.g.position,dx=pp.x-c.x,dz=pp.z-c.z,d=Math.hypot(dx,dz);
    if(d<6&&dx*fx+dz*fz>0&&(hornT>0||Math.abs(c.v)>4))pd.wait=Math.max(pd.wait||0,1.5);
    if(d<1.6&&Math.abs(c.v)>5&&!pd.hitT){pd.hitT=3;c.v*=.4;CD.sfx('punch',pp);CD.help('¡Has atropellado a un peatón!',2000);crime(2,'Atropellaste a un peatón con un coche.');}if(pd.hitT)pd.hitT=Math.max(0,pd.hitT-dt);}
  c.g.position.set(c.x,CD.groundY(c.x,c.z),c.z);c.g.rotation.y=c.yaw;c.g.rotation.z=clamp(-steer*c.v*.004,-.06,.06);
  PL.g.position.set(c.x,.2,c.z);PL.yaw=c.yaw;if(CD.focus)CD.focus.copy(PL.g.position);CD.focusYaw=c.yaw;
  if(eng){eng.o.frequency.value=36+Math.abs(c.v)*5;eng.g.gain.value=.03*(CD.SET.efectos||1);}
  hornT=Math.max(0,hornT-dt);if(K.h&&hornT<=0){hornT=.6;CD.sfx('horn',PL.g.position);}
  if(c.dmg>=2&&Math.random()<dt*(c.dmg*2))CD.sfx&&null;
  if(c.dmg>=5){leave(true);return;}
  CD.bar('Conduciendo',`${Math.round(Math.abs(c.v)*3.6)} km/h · Daños ${c.dmg}/5 · Radio ${DRV.radio?'sí':'no'} (R)`,Math.abs(c.v)/24);
});
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R'){if(DRV.car){DRV.radio=!DRV.radio;CD.help(DRV.radio?'Radio encendida':'Radio apagada',1200);}}
  if((e.key==='t'||e.key==='T')&&G.mode==='game'&&!G.busy&&!G.paused)callTaxi();});

// =====================================================================
//  RADIO: un pasodoble sintetizado
// =====================================================================
const MEL=[64,0,67,0,69,67,65,64,62,0,65,0,67,65,64,62,60,0,64,0,65,64,62,60,59,62,67,0,0,0,0,0];
const BAS=[48,55,48,55,43,50,43,50,45,52,45,52,43,50,48,48];
const hz=n=>440*Math.pow(2,(n-69)/12);let rStep=0,rT=0;
CD.on('update',dt=>{if(!DRV.car||!DRV.radio||!CD.AU.ctx||G.paused)return;rT-=dt;if(rT>0)return;rT=.21;
  const m=MEL[rStep%MEL.length],b=BAS[Math.floor(rStep/2)%BAS.length],g=.025*(CD.SET.musica!=null?CD.SET.musica:1);
  if(m)CD.tone(hz(m),.18,{type:'square',g:g*.6});if(rStep%2===0)CD.tone(hz(b),.2,{type:'triangle',g:g*1.2});if(rStep%4===2)CD.noise(.05,{f:3000,q:1,g:g*.5});rStep++;});

// =====================================================================
//  TAXIS
// =====================================================================
let taxi=null;
async function callTaxi(){
  if(taxi||DRV.car||CD.interior||(CD.TOWN&&CD.TOWN.cur)||(CD.MIS&&CD.MIS.on)||(CD.SIDE&&CD.SIDE.act))return CD.help('Ahora no puedes llamar a un taxi.',1800);

  g.position.set(st.x,CD.groundY(st.x,st.z),st.z);scene.add(g);const band=new T.Mesh(CD.BOX,CD.mat('#b3261e'));band.scale.set(1.75,.12,3.6);band.position.y=.9;g.add(band);taxi={g,t:0,x:st.x,z:st.z};
}
CD.on('update',dt=>{if(!taxi)return;const p=PL.g.position,t=taxi;t.t+=dt;const dx=p.x-t.x,dz=p.z-t.z,d=Math.hypot(dx,dz);
  if(d>3.5&&t.t<12){const s=Math.min(14,d*1.5)*dt;t.x+=dx/d*s;t.z+=dz/d*s;t.g.position.set(t.x,CD.groundY(t.x,t.z),t.z);t.g.rotation.y=Math.atan2(dx,dz);return;}
  if(t.asked)return;t.asked=true;rideTaxi();});
async function rideTaxi(){
  G.busy=true;const opts=[],dests=[];
  const wp=(CD.mapPts||[]).find(q=>q.col==='#b48ad8'&&q.big);if(wp){opts.push('A mi destino marcado');dests.push({x:wp.x,z:wp.z});}
  if(G.st){const pend=CD.pending().map(id=>L.EVENTS[id]).find(e=>e&&CD.slots[e.slot]);if(pend){opts.push('A mi próximo suceso: '+(pend.where||pend.title||'cita'));const s=CD.slots[pend.slot];dests.push({x:s.door.x,z:s.door.z+1.5});}}

  opts.push('Nada, gracias');

  const d=dests[c];
  if(d){await CD.fade(1,450);CD.placePlayer(d.x,d.z,0);if(G.st)CD.api.fx({fondos:-1});G.hour=(G.hour+.5)%24;await CD.fade(0,450);CD.fadeReset();CD.help('«Son veinte céntimos». El taxi se aleja.',2200);}

}
const op=CD.showPause;CD.showPause=function(){op();const m=document.querySelector('#ov .menu');if(m&&!m.querySelector('[data-taxi]')){const b=document.createElement('button');b.textContent='Llamar a un taxi';b.dataset.taxi='1';m.insertBefore(b,m.children[2]||null);}};
document.querySelector('#ov').addEventListener('click',e=>{if(e.target.closest('[data-taxi]')){CD.sfx('click');CD.resume();setTimeout(callTaxi,200);}});

// =====================================================================
//  CICLO DE VIDA
// =====================================================================
const reset=()=>{if(DRV.car)leave();if(taxi){scene.remove(taxi.g);taxi=null;}clearParked();};
CD.on('gameStart',()=>{reset();spawnParked(14);});
CD.on('chapter',()=>{reset();spawnParked(14);});
for(const ev of ['toTitle','ending'])CD.on(ev,reset);
CD.on('enterInterior',()=>{if(DRV.car)leave();});
})();
</script>
<script id="ropa">
/* =====================================================================
   CARA AL DESTINO · MEJORA · TIENDAS Y ROPA
   Sastrería, vestuario y disfraces
   ===================================================================== */
(function(){
'use strict';
const CD=window.CD;if(!CD||!CD.makeHuman)return;
const {T,$,esc,clamp,G,scene,W,PL}=CD;

// =====================================================================
//  CATÁLOGO
// =====================================================================
const OUT={
  camisa:{n:'Camisa azul del partido',p:0,d:'La de siempre. Todo el mundo sabe quién eres.',rec:1,look:{jacket:null,shirt:'#34507f',tie:null,pants:'#2b2723',hat:null,badge:1}},
  traje:{n:'Traje oscuro de abogado',p:3,d:'Respetable y serio. Te reconocen menos por la calle.',rec:.75,fx:{prestigio:2},look:{jacket:'#24262b',shirt:'#e9e2d0',tie:'#1a1a1a',pants:'#24262b',hat:null,badge:0}},
  gabardina:{n:'Gabardina y sombrero',p:4,d:'Discreta. De noche pasas casi desapercibido.',rec:.5,night:.25,fx:{policia:-2},look:{jacket:'#8a7a5a',shirt:'#e9e2d0',tie:'#3a2a1a',pants:'#3a3028',hat:'fedora',hatC:'#3a322b',badge:0}},
  obrero:{n:'Ropa de obrero y boina',p:1,d:'Un disfraz: casi nadie te reconoce, ni siquiera la policía.',rec:.2,fx:{policia:-5},look:{jacket:null,shirt:'#b9a27a',tie:null,pants:'#4a3f33',hat:'boina',hatC:'#222',badge:0}},
  frac:{n:'Frac de gala',p:6,d:'Para salones y casinos. Impresiona a la gente de dinero.',rec:1,fx:{prestigio:3,derecha:2},look:{jacket:'#111111',shirt:'#f4f0e6',tie:'#f4f0e6',pants:'#111111',hat:null,badge:0}},
  sport:{n:'Ropa de sport',p:2,d:'Jersey y pantalón claro. Cómodo para despejar la cabeza.',rec:.8,fx:{cordura:3},look:{jacket:'#c9b48a',shirt:'#efe9da',tie:null,pants:'#d8d0bf',hat:null,badge:0}}
};
const wardrobe=()=>{const f=G.st.f;f.wardrobe=f.wardrobe||['camisa'];return f.wardrobe;};
const current=()=>(G.st&&G.st.f.outfit)||'camisa';

// =====================================================================

// =====================================================================
let applied=null;
function baseLook(){return Object.assign({},CD.PLOOK||{},(G.st&&G.st.look)||{},CD.SET&&CD.SET.look||{});}
function applyOutfit(){
  if(!G.st)return;const key=current(),o=OUT[key];if(!o)return;

CD.on('update',()=>{if(G.mode==='game'&&G.st&&applied!==current())applyOutfit();});
for(const ev of ['gameStart','toTitle'])CD.on(ev,()=>{applied=null;});

// menos reconocimiento con disfraz
let rT=0;
CD.on('update',dt=>{if(G.mode!=='game'||!G.st)return;rT-=dt;if(rT>0)return;rT=1.2;
  const o=OUT[current()];let mul=o.rec;if(o.night&&G.night>.5)mul=o.night;if(mul>=1)return;const p=PL.g.position;
  for(const q of CD.peds||[]){if(q.reacted||q.noRec)continue;if(Math.hypot(q.g.position.x-p.x,q.g.position.z-p.z)<8&&Math.random()>mul){q.reacted=true;q.noRec=true;setTimeout(()=>{q.reacted=false;q.noRec=false;},20000);}}});

// =====================================================================
//  TIENDA Y VESTUARIO
// =====================================================================
function swatch(o){const l=o.look,c=[l.jacket||l.shirt,l.shirt,l.pants,l.hat?l.hatC:null].filter(Boolean);
  return `<span style="display:inline-flex;gap:3px;vertical-align:middle;margin-right:8px">${c.map(x=>`<i style="display:inline-block;width:14px;height:22px;background:${x};border:1px solid #000"></i>`).join('')}</span>`;}
function showShop(mode){
  G.paused=true;const own=wardrobe(),cur=current(),fondos=G.st.s.fondos;
  const keys=mode==='shop'?Object.keys(OUT):own;
  const rows=keys.map(k=>{const o=OUT[k],has=own.includes(k),on=k===cur;
    const btn=on?'<button disabled>Puesta</button>':has?`<button data-a="wear" data-k="${k}">Ponértela</button>`:`<button data-a="buy" data-k="${k}" ${fondos<o.p?'disabled':''}>Comprar · ${o.p} fondos</button>`;
    return `<div style="display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(239,228,200,.15)"><div style="flex:1">${swatch(o)}<b>${esc(o.n)}</b><div class="small">${esc(o.d)}</div></div><div class="menu" style="margin:0;min-width:170px">${btn}</div></div>`;}).join('');
  CD.overlay(CD.panel(`<div class="kick">${mode==='shop'?'Sastrería Ortega · Calle de Carretas':'Vestuario'}</div><h2>${mode==='shop'?'«Pase, caballero»':'Tu ropa'}</h2>
    <p class="small">Fondos: <b>${fondos}</b> · Llevas: <b>${esc(OUT[cur].n)}</b></p>${rows}<div class="menu"><button data-primary data-a="back">Salir</button></div>`),
    {back:()=>CD.resume(),
     buy:(e)=>{const k=e.target.closest('[data-k]').dataset.k,o=OUT[k];if(G.st.s.fondos<o.p)return;CD.api.fx(Object.assign({fondos:-o.p},o.fx||{}));wardrobe().push(k);G.st.f.outfit=k;CD.sfx('good');
        if(CD.logOnce)CD.logOnce('ropa_'+k,`Te compraste ${o.n.toLowerCase()}.`);showShop(mode);},
     wear:(e)=>{const k=e.target.closest('[data-k]').dataset.k;G.st.f.outfit=k;CD.sfx('click');showShop(mode);}});
}
CD.showWardrobe=()=>showShop('wardrobe');

// la tienda en la calle, cerca de la Puerta del Sol
let SHOP=null;
CD.on('init',()=>{
  const cx=W.bc(W.PLAZA[0]),cz=W.bc(W.PLAZA[1]);let best=null,bd=1e9;
  for(const c of CD.col){if(!c.bld||!c.face||c.slot)continue;const f=c.face,mx=(c.x0+c.x1)/2,mz=(c.z0+c.z1)/2;
    const fx=f==='px'?c.x1:f==='nx'?c.x0:mx,fz=f==='pz'?c.z1:f==='nz'?c.z0:mz,d=Math.hypot(fx-cx,fz-cz);
    if(d>26&&d<bd&&(f==='pz'||f==='nz'?c.x1-c.x0:c.z1-c.z0)>6){bd=d;best={c,f,fx,fz};}}
  if(!best)return;const {f,fx,fz}=best,n={pz:[0,1],nz:[0,-1],px:[1,0],nx:[-1,0]}[f],ry={pz:0,nz:Math.PI,px:Math.PI/2,nx:-Math.PI/2}[f];
  const t=CD.ctex(512,80,x=>{x.fillStyle='#1d2a3a';x.fillRect(0,0,512,80);x.fillStyle='#d9a73a';x.fillRect(0,4,512,3);x.fillRect(0,73,512,3);x.fillStyle='#efe4c8';x.font='700 40px Oswald, Impact, sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('SASTRERÍA ORTEGA',256,42);});
  const s=new T.Mesh(new T.PlaneGeometry(5,.8),new T.MeshBasicMaterial({map:t}));s.position.set(fx+n[0]*.08,3.2,fz+n[1]*.08);s.rotation.y=ry;CD.city.add(s);
  const man=CD.makeHuman(Object.assign({skin:'#d9cbb0'},OUT.frac.look));man.position.set(fx+n[0]*1.2+n[1]*1.6,.2,fz+n[1]*1.2+n[0]*1.6);man.rotation.y=ry;CD.city.add(man);
  const stand=new T.Mesh(CD.BOX,CD.mat('#3a2f26'));stand.scale.set(.8,.15,.8);stand.position.set(man.position.x,.12,man.position.z);CD.city.add(stand);
  SHOP={x:fx+n[0]*1.3,z:fz+n[1]*1.3};CD.circ.push({x:man.position.x,z:man.position.z,r:.5});
  if(CD.mapPts)CD.mapPts.push({x:SHOP.x,z:SHOP.z,col:'#d9a73a',shop:true});
});
CD.addInteract(40,{test(){if(!SHOP||CD.interior||(CD.TOWN&&CD.TOWN.cur)||!G.st||CD.inCar)return null;const p=PL.g.position;return Math.hypot(SHOP.x-p.x,SHOP.z-p.z)<2.6?'Entrar en la Sastrería Ortega':null;},act(){showShop('shop');}});

// botón en la pausa
const op=CD.showPause;CD.showPause=function(){op();const m=document.querySelector('#ov .menu');if(m&&G.st&&!m.querySelector('[data-ropa]')){const b=document.createElement('button');b.textContent='Vestuario';b.dataset.ropa='1';m.insertBefore(b,m.children[2]||null);}};
document.querySelector('#ov').addEventListener('click',e=>{if(e.target.closest('[data-ropa]')){CD.sfx('click');showShop('wardrobe');}});
})();
</script>
<script id="nombre">
/* =====================================================================
   EL AUSENTE · nombre del juego en todas las pantallas
   ===================================================================== */
(function(){
'use strict';
const NAME='El Ausente';
const RE=/cara\s+al\s+destino/gi;
const fix=s=>s.replace(RE,m=>m===m.toUpperCase()?NAME.toUpperCase():NAME);
function walk(n){
  if(n.nodeType===3){if(RE.test(n.nodeValue)){RE.lastIndex=0;n.nodeValue=fix(n.nodeValue);}RE.lastIndex=0;return;}
  if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE')return;
  for(const a of ['title','aria-label','placeholder','alt'])if(n.hasAttribute&&n.hasAttribute(a)){const v=n.getAttribute(a);if(RE.test(v)){RE.lastIndex=0;n.setAttribute(a,fix(v));}RE.lastIndex=0;}
  for(const c of n.childNodes)walk(c);
}
document.title=NAME;
walk(document.body);
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')walk(m.target);else for(const n of m.addedNodes)walk(n);}if(document.title!==NAME)document.title=NAME;})
  .observe(document.body,{childList:true,subtree:true,characterData:true});
if(window.CD)window.CD.GAME_NAME=NAME;
})();
</script>
