<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>El Ausente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Special+Elite&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   ESTILOS DE TODA LA INTERFAZ
   ===================================================================== */
:root{--cream:#efe4c8;--ink:#16120f;--red:#b3261e;--redD:#7d1a15;--blue:#2f4a7a;--gold:#d9a73a;
  --title:'Oswald',Impact,'Arial Narrow',sans-serif;--type:'Special Elite','Courier New',monospace;--body:'Libre Baskerville',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--cream);font:16px/1.5 var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
button{font:inherit;color:inherit}
#game{position:fixed;inset:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
/* capas sobre la imagen */
#grade{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;background:linear-gradient(180deg,rgba(255,190,120,.22),rgba(255,150,80,.14) 60%,rgba(90,60,40,.18))}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(10,5,0,.5) 100%)}
#grain{position:absolute;inset:-60px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:grn .5s steps(4) infinite}
@keyframes grn{0%{transform:translate(0,0)}25%{transform:translate(-20px,12px)}50%{transform:translate(14px,-18px)}75%{transform:translate(-8px,-6px)}}
#hurt{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(150,10,5,.7));opacity:0}
#fade{position:absolute;inset:0;background:#0b0907;opacity:0;pointer-events:none;transition:opacity .5s;z-index:4;display:grid;place-items:center}
#fade span{font-family:var(--title);font-size:28px;letter-spacing:.1em;text-transform:uppercase;opacity:0}
body.nograin #grain,body.novig #vig,body.nograde #grade{display:none}
body.cell #fade{opacity:.9}body.cell #fade span{opacity:.8}
/* marcador */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
body.ingame #hud{opacity:1}
#obj{position:absolute;top:max(14px,env(safe-area-inset-top));left:18px;max-width:46vw}
#obj b{font-family:var(--title);font-weight:600;font-size:20px;letter-spacing:.06em;text-transform:uppercase;display:block;text-shadow:0 2px 4px #000}
#obj span{font-family:var(--type);font-size:14px;color:#e3d5b0;text-shadow:0 1px 3px #000}
#help{position:absolute;top:84px;left:18px;max-width:340px;background:rgba(14,11,9,.86);border-left:3px solid var(--red);padding:10px 14px;font-size:14px;display:none}
#help.on{display:block}
#notes{position:absolute;top:70px;right:18px;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.note{background:rgba(14,11,9,.82);padding:5px 12px;font-family:var(--title);letter-spacing:.05em;font-size:15px;animation:nin .3s}
.note.up{border-right:3px solid #9fc47a}.note.down{border-right:3px solid #e0503a}
@keyframes nin{from{opacity:0;transform:translateX(20px)}}
#wanted{position:absolute;top:max(12px,env(safe-area-inset-top));right:18px;font-size:26px;letter-spacing:4px;text-shadow:0 2px 4px #000}
#wanted i{font-style:normal;color:rgba(239,228,200,.22)}#wanted i.on{color:var(--cream)}
#wanted i.on.blink{animation:wb .7s steps(2) infinite}@keyframes wb{50%{opacity:.35}}
#mapw{position:absolute;left:18px;bottom:max(18px,env(safe-area-inset-bottom));width:170px}
#mm{width:170px;height:170px;border-radius:50%;border:3px solid rgba(239,228,200,.85);box-shadow:0 0 0 2px #000,0 6px 20px #000;display:block}
#clock{position:absolute;top:-6px;right:-10px;background:rgba(14,11,9,.85);font-family:var(--title);font-size:14px;padding:1px 7px;letter-spacing:.05em}
#cores{display:flex;justify-content:space-between;margin-top:8px}
.core{width:40px;text-align:center;font-family:var(--title);font-size:11px;letter-spacing:.04em;text-shadow:0 1px 2px #000}
.core canvas{width:34px;height:34px;display:block;margin:0 auto 2px}
#hpw{height:7px;background:rgba(0,0,0,.6);border:1px solid rgba(239,228,200,.55);margin-top:8px}
#hpw i{display:block;height:100%;width:100%;background:#c23a2a;transition:width .2s}
#prompt{position:absolute;right:24px;bottom:120px;display:none;align-items:center;gap:10px;background:rgba(14,11,9,.85);padding:8px 14px;font-family:var(--title);letter-spacing:.04em;font-size:17px}
#prompt.on{display:flex}
.key{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border:2px solid var(--cream);border-radius:4px;font-family:var(--title);font-size:15px;line-height:1}
#ammo{position:absolute;right:24px;bottom:max(24px,env(safe-area-inset-bottom));font-family:var(--title);font-size:22px;letter-spacing:.05em;text-shadow:0 2px 4px #000;display:none}
body.armed #ammo{display:block}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;display:none}
#cross:before,#cross:after{content:"";position:absolute;background:#efe4c8;box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
body.aiming #cross{display:block}
#bar{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);min-width:min(360px,70vw);display:none;text-align:center;background:rgba(14,11,9,.78);border-top:2px solid var(--red);padding:6px 14px;font-family:var(--title);letter-spacing:.05em;text-shadow:0 1px 3px #000}
#bar.on{display:block}
#bar b{display:block;font-size:15px;text-transform:uppercase}#bar span{display:block;font-size:14px;color:#e3d5b0}
#bar i{display:block;height:6px;background:rgba(0,0,0,.6);border:1px solid rgba(239,228,200,.45);margin-top:4px}
#bar s{display:block;height:100%;width:0;background:var(--gold);text-decoration:none;transition:width .3s}
body.inside #mapw{display:none}body.bar #wanted{display:none}
/* diálogos */
#dlg{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(860px,94vw);display:none;text-align:center;z-index:5}
#dlg.on{display:block}
#who{font-family:var(--title);font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#f0b9a0;font-size:16px;text-shadow:0 2px 3px #000}
#txt{font-size:19px;line-height:1.5;text-shadow:0 2px 4px #000;background:rgba(10,8,6,.62);padding:10px 16px;border-radius:3px;cursor:pointer}
#more{font-family:var(--type);font-size:13px;color:#cbbc98;visibility:hidden}#more.on{visibility:visible}
#ch{display:flex;flex-direction:column;gap:5px;margin-top:10px}
#ch .opt{background:rgba(14,11,9,.88);border:0;border-left:4px solid transparent;padding:10px 14px;text-align:left;font-size:16px;cursor:pointer;min-height:46px;display:flex;align-items:center;gap:12px}
#ch .opt:hover,#ch .opt:focus-visible{border-left-color:var(--red);background:rgba(70,22,18,.94);outline:none}
#ch .askrow{display:flex;gap:6px}
#ch .askrow input{flex:1;min-width:0;background:rgba(239,228,200,.96);color:#16120f;border:0;border-left:4px solid var(--red);padding:12px 14px;font:16px var(--body);outline:none}
#ch .say{background:var(--red);border:0;padding:0 18px;font-family:var(--title);letter-spacing:.06em;text-transform:uppercase;min-height:46px;cursor:pointer}
#ch .chips,#ch .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#ch .chip{background:rgba(14,11,9,.82);border:1px solid rgba(239,228,200,.3);padding:6px 10px;font-size:13px;font-style:italic;min-height:36px;cursor:pointer}
#ch .act{background:rgba(70,22,18,.92);border:1px solid var(--red);padding:8px 14px;font-family:var(--title);letter-spacing:.05em;text-transform:uppercase;min-height:42px;cursor:pointer}
#tbar{height:4px;background:rgba(255,255,255,.15);margin-top:8px;display:none}#tbar.on{display:block}#tbar i{display:block;height:100%;width:100%;background:var(--red)}
/* controles táctiles */
#touch{position:absolute;inset:0;pointer-events:none;display:none}
body.touch.ingame #touch{display:block}body.busy #touch{display:none!important}
#joyzone{position:absolute;left:0;bottom:0;width:45%;height:62%;pointer-events:auto}
#joy{position:absolute;left:36px;bottom:36px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(239,228,200,.5);background:rgba(14,11,9,.28)}
#knob{position:absolute;left:33px;top:33px;width:50px;height:50px;border-radius:50%;background:rgba(239,228,200,.65)}
#tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));width:240px;height:250px}
.tb{position:absolute;pointer-events:auto;width:66px;height:66px;border-radius:50%;border:2px solid rgba(239,228,200,.7);background:rgba(14,11,9,.55);font-family:var(--title);font-size:13px;letter-spacing:.03em;touch-action:none;padding:0}
.tb.big{width:82px;height:82px;font-size:24px}.tb.on{background:var(--red)}.tb.hide{display:none}
.tb.pulse{animation:pul 1s infinite}@keyframes pul{50%{box-shadow:0 0 0 8px rgba(179,38,30,.45)}}
#tpause{top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:46px;height:46px;font-size:16px}
body.touch #mapw{top:max(10px,env(safe-area-inset-top));bottom:auto;left:10px;width:118px}
body.touch #mm{width:118px;height:118px}body.touch .core canvas{width:26px;height:26px}
body.touch #obj{left:140px;top:max(10px,env(safe-area-inset-top))}body.touch #obj b{font-size:15px}
body.touch #help{left:140px;top:70px;max-width:52vw}body.touch #prompt{bottom:290px}
body.touch #wanted{top:60px;font-size:20px}body.touch #ammo{bottom:auto;top:96px}
/* menús y pantallas */
#ov{position:absolute;inset:0;display:none;overflow-y:auto;z-index:10;touch-action:pan-y}
#ov.on{display:block}
.scr{min-height:100%;display:flex;padding:16px}
.scr.flush{padding:0}
.title{padding:0;background:linear-gradient(90deg,rgba(10,8,6,.94) 0,rgba(10,8,6,.72) 40%,rgba(10,8,6,0) 75%)}
.tl{padding:max(40px,6vh) 6vw;display:flex;flex-direction:column;justify-content:center;max-width:580px}
.title h1{font-family:var(--title);font-weight:700;text-transform:uppercase;font-size:clamp(46px,8vw,96px);line-height:.92;margin:8px 0 26px;text-shadow:0 4px 0 var(--redD),0 10px 30px #000}
.kick{font-family:var(--type);color:#d8c9a2;letter-spacing:.08em}
.menu{display:flex;flex-direction:column;gap:2px;max-width:420px;margin-top:14px}
.menu button{background:transparent;border:0;text-align:left;padding:10px 16px;font-family:var(--title);font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:rgba(239,228,200,.78);cursor:pointer;min-height:48px}
.menu button:hover,.menu button:focus-visible{color:#fff;background:linear-gradient(90deg,rgba(179,38,30,.9),rgba(179,38,30,0));outline:none}
.menu button small{display:block;font-family:var(--type);text-transform:none;letter-spacing:0;font-size:13px;color:#cbbc98}
.side{margin:0 auto 0 0;min-height:100%;width:min(560px,100vw);background:linear-gradient(90deg,rgba(10,8,6,.96),rgba(10,8,6,.86) 80%,rgba(10,8,6,0));padding:max(34px,5vh) clamp(18px,4vw,48px) 70px}
.side.right{margin:0 0 0 auto;background:linear-gradient(270deg,rgba(10,8,6,.96),rgba(10,8,6,.86) 80%,rgba(10,8,6,0))}
.side h2,.pan h2{font-family:var(--title);text-transform:uppercase;font-size:clamp(30px,5vw,50px);letter-spacing:.04em;margin:2px 0 0;line-height:1}
.side h3,.pan h3{font-family:var(--title);text-transform:uppercase;letter-spacing:.06em;color:#e0503a;font-size:16px;margin:20px 0 4px;font-weight:600}
.side p,.pan p{max-width:64ch}
.rule{height:2px;background:linear-gradient(90deg,var(--red),transparent);margin:12px 0 18px}
.pan{margin:auto;width:min(780px,96vw);background:rgba(12,10,8,.93);border-top:3px solid var(--red);padding:24px clamp(16px,4vw,40px);box-shadow:0 20px 60px #000}
.year{font-family:var(--title);font-weight:700;font-size:clamp(70px,14vw,140px);line-height:.85;color:var(--red)}
.news{font-family:var(--type);font-size:17px;line-height:1.6}
.small{font-size:13px;color:#cbbc98;max-width:48ch;margin-top:20px}
.keys{font-family:var(--type);font-size:14px;color:#cbbc98}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(239,228,200,.12);flex-wrap:wrap}
.row b{font-family:var(--title);font-weight:400;letter-spacing:.05em;text-transform:uppercase;font-size:17px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{background:rgba(255,255,255,.06);border:1px solid rgba(239,228,200,.25);padding:7px 12px;cursor:pointer;font-family:var(--title);letter-spacing:.04em;min-height:42px}
.seg button.on{background:var(--red);border-color:var(--red)}
.vol{display:flex;gap:3px}.vol button{width:30px;height:24px;background:rgba(255,255,255,.1);border:0;cursor:pointer}.vol button.on{background:var(--cream)}
.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(239,228,200,.14);padding:8px;cursor:pointer;text-align:left;width:100%;min-height:84px}
.slot:hover,.slot:focus-visible{border-color:var(--red);background:rgba(120,30,24,.35);outline:none}
.slot img,.slot .ph{width:128px;height:72px;object-fit:cover;background:#221b16;display:block}
.slot b{font-family:var(--title);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:17px;display:block}
.slot span{font-family:var(--type);font-size:13px;color:#cbbc98;display:block}.slot.empty b{color:#8a7a62}
.opt2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(239,228,200,.12);flex-wrap:wrap}
.opt2 b{font-family:var(--title);font-weight:400;text-transform:uppercase;letter-spacing:.05em}
.arr{display:flex;align-items:center;gap:8px}
.arr button{width:42px;height:42px;background:rgba(255,255,255,.06);border:1px solid rgba(239,228,200,.3);cursor:pointer}
.arr span{min-width:150px;text-align:center;font-family:var(--title);letter-spacing:.04em}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:32px;height:32px;border:2px solid rgba(239,228,200,.3);cursor:pointer;border-radius:50%}.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.card{border:1px solid rgba(239,228,200,.2);padding:10px 12px;background:rgba(255,255,255,.03)}
.card b{font-family:var(--title);text-transform:uppercase;letter-spacing:.04em;display:block}.card small{font-family:var(--type);color:#cbbc98}
.card.lock{border-style:dashed;opacity:.75}
details{border:1px solid rgba(239,228,200,.2);margin:6px 0;background:rgba(255,255,255,.03)}
summary{cursor:pointer;padding:10px 12px;font-family:var(--title);text-transform:uppercase;letter-spacing:.04em;min-height:44px}
details p{margin:0 12px 12px;font-size:15px}
.stat{display:grid;grid-template-columns:110px 1fr 36px;gap:10px;align-items:center;font-family:var(--title);letter-spacing:.04em;margin:7px 0}
.stat i{height:8px;background:rgba(255,255,255,.1);display:block}.stat i s{display:block;height:100%;background:var(--cream)}.stat.bad i s{background:var(--red)}
ul.log{font-size:14px;color:#e3d5b0;padding-left:20px}
.hints{position:fixed;right:24px;bottom:max(16px,env(safe-area-inset-bottom));display:flex;gap:18px;font-family:var(--title);letter-spacing:.05em;font-size:15px;color:#d8c9a2;z-index:11;pointer-events:none}
body.touch .hints{display:none}
</style>
</head>
<body>
<div id="game">
  <canvas id="c3d"></canvas>
  <div id="grade"></div><div id="vig"></div><div id="grain"></div><div id="hurt"></div>
  <div id="fade"><span>Cárcel Modelo de Madrid</span></div>
  <div id="hud">
    <div id="obj"><b id="objT"></b><span id="objS"></span></div>
    <div id="help"></div><div id="notes"></div><div id="wanted"></div>
    <div id="bar"><b></b><span></span><i><s></s></i></div>
    <div id="mapw"><canvas id="mm" width="200" height="200"></canvas><div id="clock">10:00</div><div id="cores"></div><div id="hpw"><i></i></div></div>
    <div id="prompt"></div><div id="ammo"></div><div id="cross"></div>
  </div>
  <div id="dlg"><div id="who"></div><div id="txt"></div><div id="more">▸ E, Espacio o toca para seguir</div><div id="ch"></div><div id="tbar"><i></i></div></div>
  <div id="touch">
    <div id="joyzone"><div id="joy"><div id="knob"></div></div></div>
    <div id="tbtns">
      <button class="tb big" data-k="use" style="right:0;bottom:78px">E</button>
      <button class="tb" data-k="jump" style="right:94px;bottom:0">Saltar</button>
      <button class="tb" data-k="run" style="right:100px;bottom:96px">Correr</button>
      <button class="tb hide" data-k="hit" style="right:4px;bottom:176px">Golpe</button>
      <button class="tb hide" data-k="attack" style="right:92px;bottom:186px">Disparo</button>
      <button class="tb hide" data-k="aim" style="right:176px;bottom:140px">Apuntar</button>
      <button class="tb hide" data-k="veh" style="right:180px;bottom:44px">Coche</button>
    </div>
    <button id="tpause" class="tb" data-k="pause">II</button>
  </div>
  <div id="ov"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="logic">
// =====================================================================
//  LÓGICA DEL JUEGO (sin DOM): estado, capítulos, sucesos y finales
// =====================================================================
var LOGIC = (function(){
  const STAT_KEYS=['apoyo','partido','militares','derecha','policia','coherencia','fondos','cordura','prestigio'];
  const STAT_LABEL={apoyo:'Apoyo',partido:'Partido',militares:'Militares',derecha:'Derecha',policia:'Policía',coherencia:'Doctrina',fondos:'Fondos',cordura:'Cordura',prestigio:'Prestigio'};
  const STAT_HELP={apoyo:'Apoyo popular',partido:'Fuerza del partido (afiliados)',militares:'Relación con los militares',derecha:'Relación con la derecha conservadora',policia:'Vigilancia policial: si llega al máximo, te detienen',coherencia:'Coherencia ideológica',fondos:'Fondos del partido',cordura:'Cordura y estabilidad personal',prestigio:'Prestigio intelectual'};

  function newState(){
    return {ch:1,
      s:{apoyo:15,partido:10,militares:20,derecha:30,policia:10,coherencia:70,fondos:30,cordura:80,prestigio:40,
         izquierda:0,moderacion:0,juventud:0,poesia:0},
      f:{},done:[],log:[]};
  }
  function applyFx(st,fx){
    const ch={};
    for(const k in fx){ if(!(k in st.s)) continue; const o=st.s[k]; st.s[k]=Math.max(0,Math.min(100,o+fx[k])); ch[k]=st.s[k]-o; }
    return ch;
  }

  // ----- mitines -----
  const THEMES=[
    {id:'patria',name:'Patria',lines:['Hablas de una España unida por encima de partidos y clases.','Evocas una historia común y un destino compartido.']},
    {id:'justicia',name:'Justicia social',lines:['Prometes pan, trabajo y tierra para quien la trabaja.','Denuncias la miseria de los jornaleros y el egoísmo de los ricos.']},
    {id:'juventud',name:'Juventud',lines:['Llamas a los jóvenes a tomar las riendas de su tiempo.','Dices que el futuro pertenece a quien hoy tiene veinte años.']},
    {id:'critica',name:'Contra el sistema',lines:['Arremetes contra los partidos y el parlamentarismo.','Acusas al Gobierno de dividir y debilitar el país.']},
    {id:'poesia',name:'Poesía',lines:['Recurres a imágenes líricas: luceros, amaneceres, ríos de esperanza.','Hablas más como un poeta que como un político.']}
  ];
  const THEME_FX={patria:{coherencia:1},justicia:{izquierda:2},juventud:{juventud:4},critica:{policia:3,apoyo:1},poesia:{poesia:2,prestigio:1}};
  const AUDIENCES={

  async function cortesDebate(a){
    a.backdrop('cortes');
    let total=0;
    for(const rd of CORTES){
      const opts=rd.r.slice().sort(()=>Math.random()-.5);
      const i=await a.choose(rd.text,opts.map(o=>o[0]),{timer:18,who:rd.who,p:rd.p});
      if(i<0){ total+=0; a.fx({cordura:-3}); await a.say('Narrador','Te quedas en blanco. Risas en los escaños.','narrador'); continue; }
      const t=opts[i][1];
      if(t==='brillante'){total+=1;a.fx({prestigio:3});}
      else if(t==='agresiva'){total+=.7;a.fx({apoyo:3,policia:2});}
      else {total+=.8;a.fx({moderacion:5});}
    }
    a.backdrop(null);
    return total/CORTES.length;
  }

      else {a.fx({militares:-15,moderacion:10,coherencia:3});a.log('Rechazaste la vía militar.');}
    }},
    campo:{slot:10,bld:'autobus',label:'Coche de línea a Castilla',run:async a=>{
      await a.say('Narrador','Un pueblo de Castilla. En la plaza esperan jornaleros con la gorra en la mano y labradores que desconfían de los señores de Madrid.','narrador');
      const sc=await a.mitin('campesinos',{prov:true});
      await mitinResult(a,sc);
      const c=await a.choose('Al terminar, un jornalero te pregunta qué pasará con la tierra.',[
        'Una reforma agraria a fondo: la tierra, para quien la trabaja.',
        'Una reforma gradual, pactada con los propietarios.',
        'Prometerle lo que quiera oír.'],{who:'José Antonio',p:'ja'});
      if(c===0){a.fx({apoyo:8,derecha:-15,izquierda:6,coherencia:5});}
      else if(c===1){a.fx({derecha:10,coherencia:-8,moderacion:8});}
      else {a.fx({apoyo:10,prestigio:-8,cordura:-5});}
    }},
    julian2:{slot:0,bld:'casapueblo',label:'Casa del Pueblo del barrio',run:async a=>{
      if(a.F.julian===2||a.S.izquierda>=20){
        await a.say('Julián Arce','Esta noche hablan los de mi célula con los obreros del barrio. Ven y escucha. Sin camisa, sin escolta. Solo tú.','julian');
        const c=await a.choose('Julián te invita a una reunión comunista.',[
          'Ir y escuchar de verdad.',
          'Ir, pero a debatir.',
          'Rechazarlo.'],{who:'José Antonio',p:'ja'});
        if(c===0){a.fx({izquierda:20,coherencia:-15,cordura:5,policia:5});a.log('Escuchaste a los obreros comunistas en la Casa del Pueblo.');}
        else if(c===1){a.fx({prestigio:5,izquierda:5});}
        else {a.fx({coherencia:5});}
      } else {
        await a.say('Narrador','Te llega la noticia: Julián, tu amigo de la infancia, ha sido herido en una reyerta entre grupos rivales.','narrador');
        const c=await a.choose('¿Vas a verle al hospital?',['Visitarle en el hospital.','No ir.'],{who:'José Antonio',p:'ja'});
        if(c===0){a.fx({cordura:5,izquierda:5,moderacion:5});await a.say('Julián Arce','No esperaba verte aquí. Esto no lo arregla ninguna bandera, José.','julian');}
        else {a.fx({cordura:-8,coherencia:3});}
      }
    }},
    ballena:{slot:1,bld:'cafelyon',label:'Café Lyon: tertulia «La Ballena Alegre»',run:async a=>{
      await a.say('Narrador','En el sótano del café Lyon se reúnen cada tarde escritores y poetas afines. Te piden que leas algo tuyo.','narrador');
      const c=await a.choose('La tertulia te tienta.',[
        'Dedicar las noches a escribir.',
        'Leer algo y volver enseguida a la política.',
        'No tienes tiempo para versos.'],{who:'José Antonio',p:'ja'});
      if(c===0){a.fx({poesia:20,prestigio:10,partido:-5,cordura:10});a.log('Dedicaste tus noches a escribir.');}
      else if(c===1){a.fx({poesia:6,prestigio:4});}
      else {a.fx({partido:5,cordura:-5});}
    }},
    // ===== CAPÍTULO IV =====
    elecciones:{slot:1,bld:'cine',label:'Cine Monumental',run:async a=>{
      await a.say('Narrador','Febrero de 1936. Campaña electoral. Mitin en un cine de barrio obrero: buena parte del público ha venido a abuchearte.','narrador');
      const sc=await a.mitin('obreros',{prov:true});
      await mitinResult(a,sc);
      const c=await a.choose('¿Cómo concurres a las elecciones?',[
        'En solitario, con tu propio programa.',
        'Dentro de la candidatura de derechas.'],{who:'José Antonio',p:'ja'});
      let won;
      if(c===0){a.fx({coherencia:8});won=a.S.apoyo>=60;}
      else {a.fx({derecha:8,coherencia:-12});won=a.S.apoyo>=40&&a.S.derecha>=40;}
      if(won){a.F.acta=1;a.fx({prestigio:5});a.log('Conservaste el escaño en febrero de 1936.');await a.say('Narrador','Contra todo pronóstico, conservas tu escaño.','narrador');}
      else {a.F.acta=0;a.fx({apoyo:-5,cordura:-5,policia:8});a.log('Perdiste el escaño en febrero de 1936.');await a.say('Narrador','Falange no obtiene ningún escaño. Pierdes el acta... y la inmunidad.','narrador');}
      await a.say('Narrador','Gana el Frente Popular. Tras las elecciones, la violencia callejera se dispara: atentados, represalias, entierros que acaban en tiroteos.','narrador');
    }},
    violencia:{slot:4,bld:'cafe',label:'Salida del café',req:['elecciones'],run:async a=>{
      await a.say('Narrador','Una tarde, a la salida de un café, un joven militante se te acerca nervioso. Lleva algo envuelto en un periódico.','narrador');
      const c=await a.choose('Un desconocido te ofrece una pistola: «Para su protección, jefe». ¿Qué haces?',[
        'Rechazarla y pedir a los tuyos que no respondan a la violencia.',
        'Guardarla en el bolsillo del abrigo.',
        'Entregarla a la policía y denunciar el reparto de armas.'],{who:'¡Decide rápido!',p:'ja',timer:15});
      if(c===0){a.fx({moderacion:10,policia:-5,partido:-4,cordura:3});a.log('Rechazaste el arma y pediste no responder a la violencia.');}
      else if(c===1){a.fx({policia:15,militares:5,cordura:-8});a.F.pistola=1;a.log('Aceptaste un arma.');}
      else if(c===2){a.fx({policia:-12,moderacion:10,partido:-10,coherencia:-5});a.log('Entregaste el arma a la policía.');}
      else {a.fx({cordura:-10,policia:5});await a.say('Narrador','Te quedas paralizado. El chico se va... y alguien os ha visto juntos.','narrador');}
    }},
    ilegal:{slot:8,bld:'garaje',label:'Garaje de la calle del Pez',req:['violencia'],run:async a=>{
      await a.say('Narrador','Marzo de 1936. El Gobierno suspende Falange y ordena detener a sus dirigentes. Un camarada tiene un coche en marcha en este garaje: hay que salir de Madrid.','narrador');
      const sc=await a.action('coche');
      let caught=sc<0.5||a.S.policia>=60;
      if(a.F.pistola&&a.S.policia>=50)caught=true;
      if(caught&&a.F.acta&&a.S.policia<75&&sc>=0.5)caught=false;
      if(caught){a.F.detenido=1;a.fx({cordura:-10});a.log('Te detuvieron en marzo de 1936.');await a.say('Narrador','La policía te alcanza. Ingresas en la Cárcel Modelo de Madrid. Desde ahora, todo lo que hagas será desde una celda.','narrador');}
      else {a.fx({cordura:-8,prestigio:3,partido:3});a.log('Escapaste y pasaste a la clandestinidad.');await a.say('Narrador','Despistas a la policía. Pasas a la clandestinidad y cambias de casa cada noche.','narrador');}

    mola:{slot:3,bld:'plain',label:'Casa de un enlace militar',req:['ilegal'],run:async a=>{
      if(a.F.detenido)await a.say('Narrador','Un abogado te visita en la cárcel. Trae un mensaje del general Mola, «el Director» de la conspiración militar.','narrador');
      else await a.say('Narrador','En una casa discreta te espera un enlace del general Mola, «el Director» de la conspiración militar.','narrador');
      await a.say('Enlace del general Mola','El general prepara un alzamiento. Quiere saber si Falange estará con el Ejército, y en qué condiciones.','enlace');
      const c=await a.choose('La decisión más grave de tu vida política.',[
        'Unirte, pero exigir que Falange tenga voz en el nuevo Estado.',
        'Unirte sin condiciones: lo importante es actuar.',
        'Negarte: un golpe militar solo traerá una dictadura de generales.'],{who:'José Antonio',p:'ja'});

      else if(c===1){a.fx({militares:22,coherencia:-15});a.F.subleva=2;a.log('Te uniste a la conspiración sin condiciones.');}

    final:{slot:2,bld:'sede',label:'Julio de 1936',req:['mola'],run:async a=>{
      await a.say('Narrador','13 de julio de 1936. Calvo Sotelo ha sido asesinado por guardias de asalto y militantes socialistas, como represalia por la muerte del teniente Castillo la noche anterior. El país está al borde de la guerra.','narrador');
      const opts=a.F.detenido?[
        'Desde la celda, dar la orden de apoyar la sublevación.',
        'Proponer desde la cárcel un gobierno de concentración para evitar la guerra.',
        'Planear una fuga y cruzar a Portugal.',
        'Dejar la política y escribir.']:[
        'Apoyar la sublevación con tus milicias.',
        'Intentar mediar entre los bandos.',
        'Huir a Portugal antes de que todo estalle.',
        'Retirarte de la política y dedicarte a escribir.'];
      const c=await a.choose('Última decisión.',opts,{who:'José Antonio',p:'ja'});
      a.F.final=['subleva','mediar','exilio','poesia'][Math.max(0,c)];
      a.log('Julio de 1936: '+opts[Math.max(0,c)].charAt(0).toLowerCase()+opts[Math.max(0,c)].slice(1));
      await a.say('Narrador','17 y 18 de julio de 1936. Las guarniciones se sublevan. El golpe triunfa en unas zonas y fracasa en otras. Empieza la guerra.','narrador');
    }}
  };

  function reqOk(id,st){const e=EVENTS[id];return !e.req||e.req.every(r=>st.done.includes(r));}

  // ----- finales -----
  const ENDINGS={
    carcel:{t:'Tras los barrotes',pista:'Deja que la vigilancia policial llegue a lo más alto.',
      news:'La policía ha detenido esta madrugada al jefe de Falange. Los jueces le acusan de tenencia ilícita de armas y de incitar a la violencia. Su movimiento, descabezado, se dispersa en pequeños grupos sin rumbo. Detrás de los barrotes, el joven abogado escribe cartas que casi nadie lee.',
      arch:'José Antonio Primo de Rivera fue detenido el 14 de marzo de 1936, en plena ola de atentados y represalias entre falangistas y militantes de izquierda tras las elecciones de febrero. Se le procesó por varios delitos, entre ellos tenencia ilícita de armas, y Falange fue suspendida. En junio fue trasladado de la Cárcel Modelo de Madrid a la prisión provincial de Alicante, donde le sorprendió el estallido de la guerra.'},
    jefatura:{t:'La jefatura',pista:'El más difícil: mucho apoyo, un partido fuerte, militares y derecha a favor, la policía lejos y la cabeza fría.',
      news:'Madrid, otoño de 1936. Tras semanas de combates, el jefe de Falange jura como presidente de un Gobierno que no ha salido de las urnas. Media España celebra; la otra media calla, huye o espera en las cárceles. El nuevo Gobierno promete una revolución nacional. Nadie sabe aún cuánto costará.',
      arch:'Este final es una ucronía: nunca ocurrió. José Antonio no llegó a gobernar. La sublevación militar de julio de 1936 fracasó en buena parte del país y desembocó en una guerra civil de casi tres años, con cientos de miles de muertos y una dura represión en ambas retaguardias. El poder no lo tomó Falange, sino el general Franco, que gobernó como dictador hasta su muerte en 1975 y usó el partido como pieza de su régimen.'},
    tinta:{t:'Tinta sin eco',pista:'Llega al final sin fuerza en ningún frente, o deja el partido sin dinero.',
      news:'En una pequeña redacción, un antiguo jefe político firma columnas que leen unos pocos cientos de suscriptores. Su movimiento se deshizo sin hacer ruido. Él sigue escribiendo cada noche, convencido de que la historia todavía puede cambiar de rumbo con una buena frase.',
      arch:'Falange fue durante toda la República un partido pequeño: en las elecciones de febrero de 1936 se presentó en solitario, obtuvo apenas unas decenas de miles de votos en toda España y ningún escaño. Su crecimiento masivo llegó después del golpe de julio, cuando miles de nuevos afiliados se sumaron a sus milicias en la zona sublevada. Su prensa (F.E., Arriba) tuvo una difusión limitada y sufrió frecuentes suspensiones.'},
    rojo:{t:'El giro rojo',pista:'Escucha a Julián y a los obreros una y otra vez.',
      news:'Escándalo en Madrid: el fundador de Falange aparece en un mitin obrero junto a su amigo de la infancia, el comunista Julián Arce, y pide el poder para los sindicatos. Sus antiguos camaradas le llaman traidor; los nuevos desconfían de él. Pocas veces un hombre ha tenido tantos enemigos a la vez.',
      arch:'Este giro es ficción. Pero en los años 30 Falange competía con la izquierda obrera por el mismo público, con un discurso de «justicia social» de raíz nacionalista y críticas duras al capitalismo y al liberalismo. Ramiro Ledesma, cofundador de las JONS, insistía especialmente en ese componente social. Hubo militantes que pasaron de un extremo al otro, en ambas direcciones.'},
    liberal:{t:'El liberal',pista:'Modera tu discurso una y otra vez, hasta que la doctrina se te quede pequeña.',
      news:'El antiguo jefe de Falange anuncia que abandona el partido y reconoce ante la prensa que se equivocó de camino. Hoy defiende la Constitución, el Parlamento que antes despreciaba y la convivencia entre adversarios. Los suyos no se lo perdonan; muchos republicanos tampoco le creen.',
      arch:'Ficción. José Antonio, abogado formado en el derecho liberal, rechazó sin embargo la democracia parlamentaria, a la que culpaba de dividir España. En los años 30 el centro político se fue vaciando: partidos moderados como el Radical se hundieron en las elecciones de 1936, y la vida pública se polarizó entre bloques enfrentados.'},
    locura:{t:'La locura',pista:'No descanses nunca y deja que la cordura se agote.',
      news:'Un sanatorio en la sierra. Un hombre todavía joven pasea por el jardín y habla solo, como si se dirigiera a un teatro lleno. Le visitan su hermana y algún viejo amigo. Fuera, el país arde. Dentro, él sigue pronunciando discursos ante un público que ya no existe.',
      arch:'Ficción. La presión sobre los dirigentes de la época fue enorme: atentados, detenciones y la muerte de compañeros y amigos. Entre 1934 y 1936 la violencia política dejó cientos de muertos en España, militantes de todos los bandos, policías y transeúntes.'},
    juventud:{t:'La juventud en pie',pista:'Habla a los jóvenes, mantén la doctrina y no pierdas tu libertad.',
      news:'No llegó al poder. Pero en las universidades y en los pueblos, miles de jóvenes repiten sus ideas y le recuerdan como al hombre que les habló de tú a tú. Sus partidarios le rinden homenaje; sus adversarios advierten que el entusiasmo sin freno también conduce a la guerra.',
      arch:'José Antonio tuvo una fuerte influencia entre estudiantes y jóvenes, sobre todo a través del SEU (Sindicato Español Universitario). Tras su muerte, el régimen de Franco construyó en torno a él un culto oficial, con su nombre en calles, colegios y monumentos. Para unos fue un idealista; para otros, el fundador de un partido fascista que contribuyó a la violencia de la época. Su figura sigue siendo objeto de debate entre historiadores.'},
    exilio:{t:'El exilio',pista:'Cuando llegue julio de 1936, elige marcharte.',
      news:'Lisboa, verano de 1936. Desde un hotel junto al Tajo, un exiliado español lee los periódicos que llegan de su país: frentes, ciudades bombardeadas, amigos muertos. Escribe cartas a todos los bandos y ninguno le contesta. Ha salvado la vida, pero ya no tiene sitio en la historia que se está escribiendo.',
      arch:'Ficción. José Antonio estaba preso en Alicante, en zona republicana, cuando estalló la guerra. Los sublevados prepararon varios planes para liberarlo o canjearlo, y todos fracasaron. Portugal, gobernado por Salazar, sirvió de refugio y de base a muchos conspiradores y huidos durante la guerra.'},
    poeta:{t:'El poeta',pista:'Frecuenta las tertulias literarias y, al final, elige escribir.',
      news:'Una editorial pequeña publica un libro de versos de un antiguo político. La crítica lo recibe con curiosidad. Él ha dejado los mítines y pasa las tardes en tertulias, discutiendo de metáforas en lugar de programas. Algunos dicen que es una huida; él dice que por fin ha encontrado su voz.',
      arch:'Ficción con fondo real. José Antonio cultivaba una retórica muy literaria y se rodeó de escritores: en el sótano del café Lyon de Madrid se reunía la tertulia «La Ballena Alegre», a la que acudían autores como Rafael Sánchez Mazas o Agustín de Foxá. Dionisio Ridruejo, poeta falangista de esa generación, rompió después con el régimen y pasó a la oposición.'},
    ausente:{t:'El ausente',pista:'El final histórico: acaba en la cárcel sin renunciar a tus ideas.',
      news:'Alicante, 20 de noviembre de 1936. Al amanecer, en el patio de la prisión provincial, se cumple la sentencia de un tribunal popular. Al otro lado del frente, su nombre se convertirá en bandera y durante décadas se hablará de él como del «Ausente». Él ya no podrá decir nada sobre el uso que hagan de su figura.',
      arch:'Este es el final histórico. José Antonio Primo de Rivera fue juzgado en Alicante por un tribunal popular, acusado de conspiración y rebelión militar, y fusilado el 20 de noviembre de 1936, con 33 años. En abril de 1937 Franco unificó por decreto Falange y los carlistas en un partido único bajo su mando, y convirtió a José Antonio en un mito oficial. Sus restos fueron llevados a El Escorial (1939) y a Cuelgamuros (1959); en 2023 fueron exhumados y trasladados al cementerio de San Isidro de Madrid.'},
    terceravia:{t:'La tercera vía',pista:'Gana prestigio, aprende a moderarte y, al final, intenta mediar.',
      news:'Una propuesta inesperada circula por Madrid: un gobierno de concentración, con nombres de distintos partidos, para detener la guerra antes de que se extienda. Su autor es el jefe de Falange. Unos lo toman por ingenuidad; otros, por maniobra. Las armas ya hablan más alto que los papeles. Nadie sabe si alguien le escuchará.',
      arch:'Tiene base real. Desde la cárcel de Alicante, José Antonio dejó notas con una lista para un posible gobierno de concentración y se ofreció a mediar para poner fin a la guerra. Su propuesta no prosperó. En esos escritos también expresaba su temor a lo que podía venir si triunfaba una dictadura militar conservadora.'},
    desplazado:{t:'Desplazado',pista:'Átate a los militares... sin tener fuerza propia suficiente.',
      news:'Burgos, 1937. Un decreto fusiona los partidos de la zona sublevada en uno solo, bajo el mando del general. El fundador de Falange conserva un cargo de honor y un despacho sin poder. Sus camisas azules desfilan, pero ya no a sus órdenes. Los militares le necesitaron; ahora les basta con su retrato.',
      arch:'Tiene base real. El Decreto de Unificación de abril de 1937 fundió Falange y la Comunión Tradicionalista en FET y de las JONS, con Franco como jefe nacional. Manuel Hedilla, que dirigía Falange en ausencia de José Antonio, se opuso y fue condenado a muerte, pena que le fue conmutada. Falange quedó convertida en el partido único del régimen, subordinada al poder militar.'}
  };
  const ENDING_ORDER=['carcel','jefatura','tinta','rojo','liberal','locura','juventud','exilio','poeta','ausente','terceravia','desplazado'];

  const FICHAS=[
    {t:'Sobre este juego',x:'«Cara al destino» es una ficción histórica interactiva. Los hechos de fondo son reales; los diálogos, la mayoría de los personajes secundarios (Julián Arce, Ernesto Vidal, Carmen Ibáñez, el marqués de Valdeolmos, el capitán Ordóñez) y casi todos los finales son inventados. Ponerse en la piel de un personaje no supone compartir sus ideas: el objetivo es entender, desde dentro, una época que terminó en guerra civil.'},
    {t:'La Segunda República (1931-1936)',x:'Proclamada el 14 de abril de 1931. Tras un primer bienio reformista (reforma agraria y militar, separación Iglesia-Estado, Estatuto de Cataluña, voto femenino) llegó en 1933 un Gobierno de centro-derecha con radicales y cedistas. La Revolución de Octubre de 1934 y su represión ahondaron la división. En febrero de 1936 ganó el Frente Popular. La sublevación militar del 17-18 de julio de 1936 abrió la Guerra Civil (1936-1939).'},
    {t:'Falange Española',x:'Partido fundado el 29 de octubre de 1933 por José Antonio Primo de Rivera, inspirado en el fascismo italiano, al que sumó elementos propios: catolicismo, una retórica muy literaria y un discurso de «justicia social» nacionalista. En 1934 se fusionó con las JONS. Defendía un Estado nacionalsindicalista y rechazaba los partidos y el parlamentarismo. Sus militantes participaron en la violencia política de la época, como víctimas y como autores. Fue electoralmente marginal hasta la guerra; tras la unificación de 1937 se convirtió en el partido único del franquismo.'}
  ];

  function checkEarly(st){
    if(st.s.policia>=100)return 'carcel';
    if(st.s.cordura<=0)return 'locura';
    if(st.s.fondos<=0&&st.s.partido<25)return 'tinta';
    return null;
  }
  function computeEnding(st){
    const s=st.s,f=st.f;
    if(s.cordura<=15)return 'locura';
    if(s.izquierda>=55)return 'rojo';
    if(s.moderacion>=55&&s.coherencia<=45)return 'liberal';
    if(f.final==='exilio'){
      if(!f.detenido)return 'exilio';
      if(s.fondos>=35||s.partido>=50)return 'exilio';
    }
    if(f.final==='poesia'&&(s.poesia>=20||s.prestigio>=60))return 'poeta';
    if(f.final==='mediar'&&s.prestigio>=50&&s.moderacion>=20)return 'terceravia';
    if(f.final==='subleva'&&!f.detenido){
      if(s.apoyo>=65&&s.partido>=60&&s.militares>=50&&s.derecha>=40&&s.cordura>=40)return 'jefatura';
      if(s.militares>=45)return 'desplazado';
    }
    if(f.detenido)return s.coherencia>=50?'ausente':'carcel';
    if(s.juventud>=32&&s.coherencia>=55)return 'juventud';
    if(s.militares>=50)return 'desplazado';
    return 'tinta';
  }

  return {STAT_KEYS,STAT_LABEL,STAT_HELP,newState,applyFx,THEMES,THEME_FX,AUDIENCES,CORTES,cortesDebate,mitinResult,CHAPTERS,EVENTS,reqOk,ENDINGS,ENDING_ORDER,FICHAS,checkEarly,computeEnding};
})();
</script>

<script id="base">
/* =====================================================================
   CARA AL DESTINO · PARTE 1 · BASE
   Utilidades, ajustes, motor 3D, controles, diálogos, menús y sonido
   ===================================================================== */
(function(){
'use strict';
const fatal=m=>{document.body.innerHTML='<div style="color:#efe4c8;background:#16120f;padding:24px;font:17px Georgia,serif;min-height:100vh">'+m+'</div>';};
if(!window.THREE){fatal('No se ha podido cargar Three.js. Necesitas conexión a internet al abrir el juego.');return;}
if(!window.LOGIC){fatal('Falta el bloque &lt;script id="logic"&gt; de tu juego original. Pégalo donde indica el comentario del HTML.');return;}
const T=THREE,L=window.LOGIC;
const CD=window.CD={T,L};

// ---------- utilidades ----------
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,t)=>a+(b-a)*t;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shade(hex,a){const n=parseInt(hex.slice(1),16);const r=clamp((n>>16)+a,0,255),g=clamp(((n>>8)&255)+a,0,255),b=clamp((n&255)+a,0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function angLerp(a,b,t){const d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;return a+d*t;}
const fmtH=h=>String(Math.floor(h)).padStart(2,'0')+':'+String(Math.floor((h%1)*60)).padStart(2,'0');
const d2=(a,b)=>(a.x-b.x)*(a.x-b.x)+(a.z-b.z)*(a.z-b.z);

  const q=CD.QUAL[CD.SET.calidad]||CD.QUAL.media;R.setPixelRatio(q.pr);R.shadowMap.enabled=!!q.sh;sun.castShadow=!!q.sh;
  if(q.sh){sun.shadow.mapSize.set(q.sh,q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    const s=sun.shadow.camera;s.left=-55;s.right=55;s.top=55;s.bottom=-55;s.near=1;s.far=240;s.updateProjectionMatrix();sun.shadow.bias=-.0006;}
  cam.far=q.far;cam.fov=CD.SET.fov;resize();
  scene.traverse(o=>{if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true);});

  const t=new T.CanvasTexture(c);t.encoding=T.sRGBEncoding;if(rep)t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=Math.min(4,R.capabilities.getMaxAnisotropy());return t;};
CD.scaleUV=function(g,w,h,d,ux,uy){const uv=g.attributes.uv;for(let f=0;f<6;f++){let su,sv;if(f<2){su=d/ux;sv=h/uy}else if(f<4){su=w/ux;sv=d/uy}else{su=w/ux;sv=h/uy}
  for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*su,uv.getY(k)*sv);}}uv.needsUpdate=true;};
CD.flatG=g=>{const n=g.index?g.toNonIndexed():g;n.computeVertexNormals();return n;};

const UI=CD.UI={mode:'idle',full:'',shown:0,res:null,t0:0,timer:null,idleAt:0};
const eD=$('#dlg'),eW=$('#who'),eT=$('#txt'),eC=$('#ch'),eB=$('#tbar'),eBi=$('#tbar i'),eM=$('#more');
UI.clear=()=>{eC.innerHTML='';eC.onclick=null;eB.classList.remove('on');eM.classList.remove('on');UI.timer=null;};
UI.say=(who,text)=>new Promise(r=>{UI.clear();eW.textContent=who||'';eT.textContent='';UI.full=String(text);UI.shown=0;UI.mode='say';UI.res=r;UI.t0=G.time;eD.classList.add('on');CD.emit('say',who,text);});
UI.advance=()=>{if(UI.mode!=='say'||G.time-UI.t0<.15)return;if(UI.shown<UI.full.length){UI.shown=UI.full.length;eT.textContent=UI.full;eM.classList.add('on');return;}UI.done();};
UI.done=v=>{UI.mode='idle';UI.idleAt=G.time;UI.clear();CD.sfx('click');CD.emit('sayEnd');const r=UI.res;UI.res=null;r&&r(v);};
UI.choose=(text,opts,o={})=>new Promise(r=>{UI.clear();eW.textContent=o.who||'';eT.textContent=text;UI.mode='choose';UI.res=r;
  eC.innerHTML=opts.map((t,i)=>`<button class="opt" data-i="${i}"><span class="key">${i+1}</span><span>${esc(t)}</span></button>`).join('');eD.classList.add('on');
  eC.onclick=e=>{const b=e.target.closest('.opt');if(b)UI.pick(+b.dataset.i);};
  const tm=o.timer&&CD.SET.tempo?o.timer*CD.SET.tempo:0;if(tm){UI.timer={end:G.time+tm,dur:tm};eB.classList.add('on');}});
UI.pick=i=>{if(UI.mode!=='choose'||i>=eC.querySelectorAll('.opt').length)return;UI.done(i);};
UI.ask=(text,o={})=>new Promise(res=>{
  UI.clear();eW.textContent=o.who||'Tu respuesta';eT.textContent=text;UI.mode='ask';eD.classList.add('on');CD.unlock();
  eC.innerHTML=`<div class="askrow"><input id="askin" type="text" maxlength="240" autocomplete="off" placeholder="${esc(o.ph||'Escribe lo que dices…')}"><button class="say">Decir</button></div>`+
    (o.chips?`<div class="chips">${o.chips.map((c,i)=>`<button class="chip" data-c="${i}">${esc(c)}</button>`).join('')}</div>`:'')+
    (o.acts?`<div class="acts">${o.acts.map(a=>`<button class="act" data-x="${a.id}">${esc(a.label)}</button>`).join('')}</div>`:'');
  const inp=$('#askin');if(!CD.isTouch)setTimeout(()=>inp.focus(),60);
  const tm=o.timer&&CD.SET.tempo?o.timer*CD.SET.tempo*1.3:0;if(tm){UI.timer={end:G.time+tm,dur:tm,ask:true};eB.classList.add('on');}
  UI.askDone=v=>{if(UI.mode!=='ask')return;UI.mode='idle';UI.idleAt=G.time;UI.clear();CD.sfx('click');if(v.text&&CD.analyze)v.an=CD.analyze(v.text);res(v);};
  eC.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('say'))UI.askDone({text:inp.value.trim()});
    else if(b.dataset.c!=null){inp.value=o.chips[+b.dataset.c];inp.focus();}else if(b.dataset.x)UI.askDone({act:b.dataset.x});};
  inp.onkeydown=e=>{if(e.key!=='Escape')e.stopPropagation();if(e.key==='Enter'){e.preventDefault();UI.askDone({text:inp.value.trim()});}};
});
UI.tick=dt=>{
  if(UI.mode==='say'&&UI.shown<UI.full.length){UI.shown=Math.min(UI.full.length,UI.shown+dt*55);eT.textContent=UI.full.slice(0,UI.shown|0);if(UI.shown>=UI.full.length)eM.classList.add('on');}
  if(UI.timer&&(UI.mode==='choose'||UI.mode==='ask')){const f=(UI.timer.end-G.time)/UI.timer.dur;eBi.style.width=Math.max(0,f*100)+'%';
    if(f<=0){if(UI.mode==='choose')UI.done(-1);else{const inp=$('#askin');UI.askDone({text:inp?inp.value.trim():'',timeout:true});}}}
  if(UI.mode==='idle'&&eD.classList.contains('on')&&G.time-UI.idleAt>.12)eD.classList.remove('on');

const N=6,BS=38,RW=14,P=BS+RW,HALF=(N*P+RW)/2,SW=3;
const bc=i=>-HALF+RW+i*P+BS/2,rc=i=>-HALF+RW/2+i*P;
const PLAZA=[2,2];
const SLOT_BLOCKS=[[1,1],[3,1],[1,3],[3,3],[0,2],[4,2],[2,0],[2,4],[5,1],[5,3],[0,4]];
const col=CD.col=[],circ=CD.circ=[],slots=CD.slots=[],LAMPS=[],TREES=[];
const city=CD.city=new T.Group();scene.add(city);
CD.W={N,BS,RW,P,HALF,SW,bc,rc,PLAZA,SLOT_BLOCKS};
function ringPt(bi,bj,u,r){const cx=bc(bi),cz=bc(bj),L2=2*r,uu=((u%(4*L2))+4*L2)%(4*L2),sd=Math.floor(uu/L2),f=uu-sd*L2;
  let x,z,dx,dz;if(sd===0){x=-r+f;z=-r;dx=1;dz=0}else if(sd===1){x=r;z=-r+f;dx=0;dz=1}else if(sd===2){x=r-f;z=r;dx=-1;dz=0}else{x=-r;z=r-f;dx=0;dz=-1}
  return {x:cx+x,z:cz+z,dx,dz,out:sd===0?Math.PI:sd===1?Math.PI/2:sd===2?0:-Math.PI/2};}
function randBlock(){let bi,bj;do{bi=Math.floor(Math.random()*N);bj=Math.floor(Math.random()*N);}while(bi===PLAZA[0]&&bj===PLAZA[1]);return [bi,bj];}
CD.ringPt=ringPt;CD.randBlock=randBlock;

function split(a,b,r){const out=[];let x=a;while(b-x>.5){let w=6+r()*5;if(b-(x+w)<5)w=b-x;out.push([x,x+w]);x+=w;}return out;}
function addBuilding(x,z,w,d,floors,pi,face,r,isSlot){
  const h=floors*3.6+.6,lit=r()<.55,g=new T.BoxGeometry(w,h,d);CD.scaleUV(g,w,h,d,4,3.6);
  const fm=FAC[pi][lit?1:0],m=sh(new T.Mesh(g,[fm,fm,ROOFM,ROOFM,fm,fm]));m.position.set(x,h/2+.2,z);city.add(m);
  const pl=sh(new T.Mesh(BOX,PLINTH[pi]));pl.scale.set(w+.16,3.5,d+.16);pl.position.set(x,1.95,z);city.add(pl);
  const co=sh(new T.Mesh(BOX,CORN[pi]),true,false);co.scale.set(w+.5,.45,d+.5);co.position.set(x,h+.2,z);city.add(co);
  col.push({x0:x-w/2-.1,x1:x+w/2+.1,z0:z-d/2-.1,z1:z+d/2+.1,h:h+.7,bld:1,face,slot:isSlot});
  const nx=face==='px'?1:face==='nx'?-1:0,nz=face==='pz'?1:face==='nz'?-1:0;
  if(!isSlot&&face&&r()<.35){const aw=new T.Mesh(BOX,AWN[Math.floor(r()*AWN.length)]),along=nx?d:w;
    aw.scale.set(nx?1.3:along*.8,.08,nx?along*.8:1.3);aw.position.set(x+nx*(w/2+.65),3.55,z+nz*(d/2+.65));if(nx)aw.rotation.z=-.3*nx;else aw.rotation.x=.3*nz;city.add(aw);}
  return h;
}
function lampsAround(cx,cz){const e=BS/2-.8;for(const t of [-13,-4.5,4.5,13])LAMPS.push({x:cx+t,y:.2,z:cz+e},{x:cx+t,y:.2,z:cz-e},{x:cx+e,y:.2,z:cz+t},{x:cx-e,y:.2,z:cz+t});}
function bench(x,z,a){const g=new T.Group(),w=M('#6a4426'),ir=M('#2a2420'),add=(m,sx,sy,sz,px,py,pz)=>{const o=sh(new T.Mesh(BOX,m));o.scale.set(sx,sy,sz);o.position.set(px,py,pz);g.add(o);};
  add(w,1.8,.08,.45,0,.62,0);add(w,1.8,.4,.06,0,.95,-.22);add(ir,.08,.6,.45,-.8,.3,0);add(ir,.08,.6,.45,.8,.3,0);g.position.set(x,.2,z);g.rotation.y=a;city.add(g);col.push({x0:x-.9,x1:x+.9,z0:z-.9,z1:z+.9,h:1.2});}
function buildPlaza(cx,cz){
  const stone=M('#a69a86'),stoneD=M('#8a7f6e');
  const base=sh(new T.Mesh(new T.CylinderGeometry(6,6.2,.7,16),stone));base.position.set(cx,.55,cz);city.add(base);
  const water=new T.Mesh(new T.CylinderGeometry(5.4,5.4,.1,16),new T.MeshLambertMaterial({color:'#5f93ad',emissive:0x0a2030}));water.position.set(cx,.86,cz);city.add(water);
  const colm=sh(new T.Mesh(new T.CylinderGeometry(.45,.6,3,8),stoneD));colm.position.set(cx,2.2,cz);city.add(colm);
  const bowl=sh(new T.Mesh(new T.CylinderGeometry(1.7,1,.4,10),stone));bowl.position.set(cx,3.6,cz);city.add(bowl);
  circ.push({x:cx,z:cz,r:6.3});
  for(let k=0;k<8;k++){const a=k/8*PI2+.2,x=cx+Math.cos(a)*14,z=cz+Math.sin(a)*14;TREES.push({x,y:.2,z,s:rnd(.85,1.1)});circ.push({x,z,r:.35});}
  for(let k=0;k<4;k++){const a=k/4*PI2+Math.PI/4;bench(cx+Math.cos(a)*8.5,cz+Math.sin(a)*8.5,-a+Math.PI/2);}
  const kx=cx-13,kz=cz+13,k1=sh(new T.Mesh(new T.CylinderGeometry(1.6,1.6,2.6,8),M('#2f5a3a')));k1.position.set(kx,1.5,kz);city.add(k1);
  const k2=sh(new T.Mesh(new T.ConeGeometry(2.2,1.2,8),M('#24452f')));k2.position.set(kx,3.4,kz);city.add(k2);circ.push({x:kx,z:kz,r:1.8});CD.kiosk={x:kx,z:kz};
  const fx=cx+15,fz=cz-15,pole=sh(new T.Mesh(new T.CylinderGeometry(.08,.12,10,6),M('#3a2f26')));pole.position.set(fx,5.2,fz);city.add(pole);

  const flag=new T.Mesh(new T.PlaneGeometry(2.4,1.6),new T.MeshLambertMaterial({map:ft,side:T.DoubleSide}));flag.position.set(fx+1.25,9.2,fz);city.add(flag);CD.flagMesh=flag;circ.push({x:fx,z:fz,r:.3});
}
function genBlock(i,j,r){
  const cx=bc(i),cz=bc(j),isPlaza=i===PLAZA[0]&&j===PLAZA[1];
  const sg=new T.BoxGeometry(BS,.2,BS);CD.scaleUV(sg,BS,.2,BS,isPlaza?6:4,isPlaza?6:4);
  const slab=sh(new T.Mesh(sg,isPlaza?GM.plaza:GM.side),false,true);slab.position.set(cx,.1,cz);city.add(slab);
  lampsAround(cx,cz);
  if(i===2||i===3){const tx=i===2?cx+BS/2-.7:cx-BS/2+.7;for(const t of [-9,0,9]){TREES.push({x:tx,y:.2,z:cz+t,s:rnd(.8,1.05)});circ.push({x:tx,z:cz+t,r:.35});}}
  if(isPlaza)return buildPlaza(cx,cz);
  const inner=BS/2-SW,D=10+Math.floor(r()*3),slot=SLOT_BLOCKS.findIndex(b=>b[0]===i&&b[1]===j);
  const fl=()=>3+Math.floor(r()*4),pal=()=>Math.floor(r()*PAL.length);
  const south=slot>=0?[...split(-inner,-5,r),[-5,5,1],...split(5,inner,r)]:split(-inner,inner,r);
  for(const s of south){const w=s[1]-s[0],x=cx+(s[0]+s[1])/2,z=cz+inner-D/2,h=addBuilding(x,z,w,D,s[2]?5:fl(),pal(),'pz',r,!!s[2]);
    if(s[2])slots[slot]={x,z:cz+inner,door:{x,z:cz+inner+1.6},h,w};}
  for(const s of split(-inner,inner,r))addBuilding(cx+(s[0]+s[1])/2,cz-inner+D/2,s[1]-s[0],D,fl(),pal(),'nz',r);
  for(const s of split(-inner+D,inner-D,r)){const w=s[1]-s[0],z=cz+(s[0]+s[1])/2;addBuilding(cx+inner-D/2,z,D,w,fl(),pal(),'px',r);addBuilding(cx-inner+D/2,z,D,w,fl(),pal(),'nx',r);}
}
function outerRing(r){const o=HALF+7;for(let i=0;i<N;i++)for(const s of split(bc(i)-BS/2,bc(i)+BS/2,r)){const w=s[1]-s[0],m=(s[0]+s[1])/2,pi=()=>Math.floor(r()*PAL.length),f=()=>3+Math.floor(r()*4);
  addBuilding(m,-o,w,12,f(),pi(),'pz',r);addBuilding(m,o,w,12,f(),pi(),'nz',r);addBuilding(-o,m,12,w,f(),pi(),'px',r);addBuilding(o,m,12,w,f(),pi(),'nx',r);}}
function inst(geo,m,arr,recv){const im=new T.InstancedMesh(geo,m,arr.length),o=new T.Object3D();
  arr.forEach((p,i)=>{o.position.set(p.x,p.y||0,p.z);o.rotation.set(0,p.ry==null?Math.random()*6:p.ry,0);o.scale.setScalar(p.s||1);o.updateMatrix();im.setMatrixAt(i,o.matrix);});
  im.castShadow=true;im.receiveShadow=recv!==false;im.frustumCulled=false;city.add(im);return im;}

// ---------- calles vivas: aparcados, escaparates, sombra al pie, mobiliario, horizonte ----------
const GLASS_LIT=new T.MeshLambertMaterial({vertexColors:true,emissive:0xffcf80,emissiveIntensity:0});GLASS_LIT.userData.k=1.1;NIGHT.push(GLASS_LIT);
function buildStreets(r){
  const buf=BUF.newBuf(),gU=BUF.newBuf(),gL=BUF.newBuf(),aoP=[],aoU=[],dens=(CD.DENS[CD.SET.dens]||CD.DENS.media).park;
  const nearDoor=(x,z,d)=>slots.some(s=>s&&Math.hypot(s.door.x-x,s.door.z-z)<(d||5));
  const park=(x,z,ry)=>{addCarBuf(buf,x,z,ry,CARCOLS[Math.floor(r()*CARCOLS.length)]);const ax=Math.abs(Math.sin(ry))>.5;col.push({x0:x-(ax?2.2:1),x1:x+(ax?2.2:1),z0:z-(ax?1:2.2),z1:z+(ax?1:2.2),h:2,car:1});};
  for(let j=0;j<=N;j++)for(let i=0;i<N;i++)for(const sd of [-1,1]){const z=rc(j)+sd*5.9;for(let x=bc(i)-BS/2+3;x<bc(i)+BS/2-3;x+=5.6)if(r()>dens&&!nearDoor(x,z))park(x,z,sd>0?Math.PI/2:-Math.PI/2);}
  for(let i=0;i<=N;i++)for(let j=0;j<N;j++)for(const sd of [-1,1]){const x=rc(i)+sd*5.9;for(let z=bc(j)-BS/2+3;z<bc(j)+BS/2-3;z+=5.6)if(r()>dens&&!nearDoor(x,z))park(x,z,sd<0?0:Math.PI);}
  const FR=['#2a3a2a','#4d3019','#2f3a4a','#5a2a1a','#3a3530'];
  for(const c of col.slice()){if(!c.bld)continue;
    const fcs=[];const cx=(c.x0+c.x1)/2,cz=(c.z0+c.z1)/2,bi=Math.floor((cx+HALF-RW)/P),bj=Math.floor((cz+HALF-RW)/P);
    if(Math.abs(cx)<HALF&&Math.abs(cz)<HALF&&bi>=0&&bi<N&&bj>=0&&bj<N){const bx=bc(bi),bz=bc(bj),e=BS/2-SW-.3;if(c.x0<=bx-e)fcs.push('nx');if(c.x1>=bx+e)fcs.push('px');if(c.z0<=bz-e)fcs.push('nz');if(c.z1>=bz+e)fcs.push('pz');}
    else if(c.face)fcs.push(c.face);
    for(const fc of fcs){
      const Ln={pz:{a:c.x0+.1,b:c.x1-.1,f:c.z1-.1,ax:'x',n:1},nz:{a:c.x0+.1,b:c.x1-.1,f:c.z0+.1,ax:'x',n:-1},px:{a:c.z0+.1,b:c.z1-.1,f:c.x1-.1,ax:'z',n:1},nx:{a:c.z0+.1,b:c.z1-.1,f:c.x0+.1,ax:'z',n:-1}}[fc];
      const Pp=(s,off)=>Ln.ax==='x'?[s,Ln.f+Ln.n*off]:[Ln.f+Ln.n*off,s];
      const [tx,tz]=Pp((Ln.a+Ln.b)/2,1.5),gy=CD.groundY(tx,tz)+.002,len=Ln.b-Ln.a;
      const q0=Pp(Ln.a,0),q1=Pp(Ln.b,0),q2=Pp(Ln.b,1.7),q3=Pp(Ln.a,1.7);
      for(const [p,u] of [[q0,[0,0]],[q1,[1,0]],[q2,[1,1]],[q0,[0,0]],[q2,[1,1]],[q3,[0,1]]]){aoP.push(p[0],gy+.01,p[1]);aoU.push(u[0],u[1]);}
      const fcol=FR[Math.floor(r()*FR.length)],n=Math.floor(len/2.7);if(n<1)continue;const st=Ln.a+(len-n*2.7)/2+1.35;
      for(let k=0;k<n;k++){const s=st+k*2.7,[x,z]=Pp(s,0);if(nearDoor(x,z,4))continue;
        const dim=(wd,th)=>Ln.ax==='x'?[wd,th]:[th,wd];
        if(k===Math.floor(n/2)&&r()<.6){const [sx,sz]=dim(1.2,.12),[dx,dz]=Pp(s,.06);BUF.box(buf,dx,gy+1.3,dz,sx,2.6,sz,'#3d2614');}
        else{let [sx,sz]=dim(2,.1),[fx,fz]=Pp(s,.05);BUF.box(buf,fx,gy+1.6,fz,sx,2.3,sz,fcol);[sx,sz]=dim(1.7,.06);[fx,fz]=Pp(s,.1);
          BUF.add(r()<.5?gL:gU,TB(),fx,gy+1.65,fz,0,sx,1.95,sz,'#2b3040');[sx,sz]=dim(2.1,.25);[fx,fz]=Pp(s,.12);BUF.box(buf,fx,gy+.42,fz,sx,.12,sz,'#9a8f7e');}}}}
  const e=BS/2-1.6;
  for(let i=0;i<N;i++)for(let j=0;j<N;j++){if(i===PLAZA[0]&&j===PLAZA[1])continue;const cx=bc(i),cz=bc(j);
    for(const sd of [-1,1])for(const t of [-9,0,9])for(const [x,z,ax] of [[cx+t,cz+sd*e,'x'],[cx+sd*e,cz+t,'z']]){
      if(r()<.55||nearDoor(x,z,4)||circ.some(c=>Math.hypot(c.x-x,c.z-z)<1.4))continue;const y=.2;
      switch(Math.floor(r()*5)){
        case 0:BUF.add(buf,TCYL(.55,.55,2.6),x,y+1.3,z,0,1,1,1,'#2f4a3a');BUF.add(buf,TCYL(.57,.57,1.6),x,y+1.4,z,0,1,1,1,pick(['#d9c9a0','#c9a84a','#b3261e','#efe4c8']));
          BUF.add(buf,TCYL(.65,.65,.15),x,y+2.65,z,0,1,1,1,'#24452f');BUF.add(buf,THEMI(.5),x,y+2.7,z,0,1,1,1,'#24452f');circ.push({x,z,r:.65});break;
        case 1:{const [sx,sz]=ax==='x'?[1.4,.8]:[.8,1.4];BUF.box(buf,x,y+.6,z,sx,1.2,sz,'#4d3019');BUF.box(buf,x,y+1.25,z,sx+.1,.1,sz+.1,'#efe9da');BUF.box(buf,x,y+1.6,z,sx+.2,.08,sz+.2,'#24452f');
          col.push({x0:x-sx/2,x1:x+sx/2,z0:z-sz/2,z1:z+sz/2,h:1.7});break;}
        case 2:{const ry=ax==='x'?0:Math.PI/2,cs=Math.cos(ry),sn=Math.sin(ry);BUF.box(buf,x,y+.85,z,1.6,.5,.9,'#6a4426',ry);
          for(const s of [-1,1])BUF.add(buf,TWH(),x+s*.55*sn,y+.4,z+s*.55*cs,ry+Math.PI/2,1,1,1,'#2a2018');
          for(let k=0;k<6;k++)BUF.box(buf,x+(k%3-1)*.4*cs,y+1.2,z-(k%3-1)*.4*sn+(k<3?-.2:.2)*cs,.3,.2,.3,pick(['#c9a84a','#8a3b3b','#4f7a3a']),ry);circ.push({x,z,r:.9});break;}
        case 3:BUF.box(buf,x,y+.3,z,.6,.6,.6,'#7a5a3a');BUF.box(buf,x+.5,y+.25,z+.2,.5,.5,.5,'#6a4a2a');BUF.add(buf,TCYL(.3,.3,.8),x-.5,y+.4,z-.2,0,1,1,1,'#4a3a2a');circ.push({x,z,r:.8});break;
        case 4:BUF.add(buf,TCYL(.22,.22,1.1),x,y+.55,z,0,1,1,1,'#c0a030');BUF.box(buf,x,y+1.15,z,.5,.15,.5,'#a08020');circ.push({x,z,r:.3});break;}}}
  city.add(BUF.mesh(buf));
  if(gU.pos.length){const m=BUF.mesh(gU);m.castShadow=false;city.add(m);}
  if(gL.pos.length){const m=BUF.mesh(gL,GLASS_LIT);m.castShadow=false;city.add(m);}
  const ag=new T.BufferGeometry();ag.setAttribute('position',new T.Float32BufferAttribute(aoP,3));ag.setAttribute('uv',new T.Float32BufferAttribute(aoU,2));
  const grad=ct(4,64,x=>{const g=x.createLinearGradient(0,0,0,64);g.addColorStop(0,'#000');g.addColorStop(1,'#fff');x.fillStyle=g;x.fillRect(0,0,4,64);});
  const ao=new T.Mesh(ag,new T.MeshBasicMaterial({color:'#000',transparent:true,opacity:.38,alphaMap:grad,depthWrite:false,side:T.DoubleSide}));ao.renderOrder=1;city.add(ao);
  const sb=BUF.newBuf(),R0=HALF+26;
  for(let a=0;a<PI2;a+=.05){const RR=R0+r()*22,x=Math.cos(a)*RR,z=Math.sin(a)*RR,w=8+r()*14,h=12+r()*26,c2=pick(['#8a7d6a','#7d7262','#94866f','#857866']);
    BUF.box(sb,x,h/2,z,w,h,w*.8,c2,-a);
    if(r()<.1){BUF.box(sb,x,h+8,z,3.2,16,3.2,c2,-a);BUF.add(sb,TCONE(2.6,5),x,h+18.5,z,0,1,1,1,'#6a5a4a');}
    else if(r()<.06){BUF.add(sb,TCYL(5,5,4),x,h+2,z,0,1,1,1,c2);BUF.add(sb,THEMI(5),x,h+4,z,0,1,1,1,'#7a8a8a');}}
  const sk=BUF.mesh(sb);sk.castShadow=false;sk.receiveShadow=false;city.add(sk);
}

// ---------- suelo, colisiones y utilidades del mapa ----------
function groundY(x,z){const f=v=>{const l=v+HALF-RW;if(l<0)return false;const i=Math.floor(l/P);if(i>=N)return false;return l-i*P<=BS;};return f(x)&&f(z)?.2:0;}
function insideBld(x,y,z){for(const c of col)if(x>c.x0&&x<c.x1&&z>c.z0&&z<c.z1&&y<c.h)return true;return false;}
function collide(p,r){
  for(const c of col){if(p.x<c.x0-r||p.x>c.x1+r||p.z<c.z0-r||p.z>c.z1+r)continue;
    const qx=clamp(p.x,c.x0,c.x1),qz=clamp(p.z,c.z0,c.z1),dx=p.x-qx,dz=p.z-qz,d=Math.hypot(dx,dz);
    if(d<r){if(d<1e-4){const l=p.x-c.x0,rr=c.x1-p.x,t=p.z-c.z0,b=c.z1-p.z,m=Math.min(l,rr,t,b);
      if(m===l)p.x=c.x0-r;else if(m===rr)p.x=c.x1+r;else if(m===t)p.z=c.z0-r;else p.z=c.z1+r;}else{p.x=qx+dx/d*r;p.z=qz+dz/d*r;}}}
  for(const c of circ){const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=c.r+r;if(d<m&&d>1e-4){p.x=c.x+dx/d*m;p.z=c.z+dz/d*m;}}
  const B=HALF+3;p.x=clamp(p.x,-B,B);p.z=clamp(p.z,-B,B);
}
Object.assign(CD,{groundY,insideBld,collide});

CD.runEvent=async function(id){
  if(G.busy)return;G.busy=true;CD.prompt();CD.unlock();
  const s=slots[L.EVENTS[id].slot];if(s)CD.placePlayer(s.door.x,s.door.z+.6,0,false);CD.emit('eventStart',id);CD.sfx('door');
  try{await (CD.eventRunner?CD.eventRunner(id):L.EVENTS[id].run(api));}catch(e){console.error(e);}
  if(!G.st.done.includes(id))G.st.done.push(id);G.busy=false;G.cy=.4;CD.emit('eventEnd',id);CD.autosave();CD.hudStats();
  const early=L.checkEarly(G.st);if(early)return CD.finish(early);CD.flow();
};
CD.flow=function(){
  const ch=L.CHAPTERS[G.st.ch],left=ch.events.filter(e=>!G.st.done.includes(e));
  if(!left.length){if(G.st.ch<4){G.st.ch++;G.st.done=[];CD.autosave();CD.showCard();}else CD.finish(L.computeEnding(G.st));return;}
  if(G.st.ch===4&&G.st.f.detenido){G.cell=true;document.body.classList.add('cell');const nx=left.find(e=>L.reqOk(e,G.st));if(nx)setTimeout(()=>CD.runEvent(nx),900);return;}
  G.cell=false;document.body.classList.remove('cell');CD.hudStats();
};
CD.addInteract(50,{test(){if(CD.interior)return null;const p=PL.g.position;for(const id of pending()){const s=slots[L.EVENTS[id].slot];if(Math.hypot(s.door.x-p.x,s.door.z-p.z)<3.2){this.id=id;return 'Entrar: '+L.EVENTS[id].label;}}return null;},
  act(){CD.runEvent(this.id);}});

CD.runMitin=async function(audId,o={}){
  const aud=L.AUDIENCES[audId];await CD.UI.say('Mitin',aud.name+'. '+aud.tip);let enth=35,last=null;
  for(let r=0;r<4;r++){const i=await CD.UI.choose(`Ronda ${r+1}/4 · Entusiasmo ${Math.round(enth)} %`,L.THEMES.map(t=>t.name),{who:'Elige tu tema',timer:16});
    if(i<0){enth=clamp(enth-12,0,100);continue;}const th=L.THEMES[i],pts=aud.pref[th.id]-(last===th.id?2:0)+(Math.random()<.5?1:0);last=th.id;api.fx(L.THEME_FX[th.id]);
    enth=clamp(enth+pts*7-3,0,100);await CD.UI.say('Público',pick(th.lines)+' '+(pts>=3?'¡Ovación!':pts<=0?'Murmullos y silbidos.':'Aplausos.'));}
  return enth/100;};
CD.runAction=async function(name){
  const A={tribuna:['El mitin se descontrola.',[['Plantar cara a los alborotadores','apoyo'],['Proteger a la presidencia','partido'],['Pedir calma','prestigio']]],
    tejados:['La policía rodea la sede.',[['Huir por los tejados','cordura'],['Esconderte en el sótano','partido'],['Salir con aplomo','prestigio']]],
    reparto:['Hay que repartir «Arriba» esta noche.',[['Repartir tú mismo','apoyo'],['Organizar a los militantes','partido'],['Pagar a unos chicos','fondos']]],
    coche:['La policía te persigue.',[['Pisar a fondo','cordura'],['Caminos secundarios','partido'],['Esconderte en un pueblo','apoyo']]]}[name];
  if(!A)return .5;const i=await CD.UI.choose(A[0],A[1].map(o=>o[0]),{who:'Situación',timer:14});if(i<0)return .15;return clamp(.15+G.st.s[A[1][i][1]]/100*.7+rnd(-.2,.2),0,1);};

const desc=s=>{const ch=L.CHAPTERS[s.st.ch];return `Cap. ${ch.roman} · ${ch.year} · ${s.st.done.length}/${ch.events.length} sucesos`;};
const latest=()=>{const a=[store.get('cd4_auto',null),...slotsAll()].filter(Boolean);a.sort((x,y)=>(y.t||0)-(x.t||0));return a[0]||null;};

function showSlots(mode,back){
  const all=slotsAll(),auto=store.get('cd4_auto',null);
  const item=(s,i,label)=>s?`<button class="slot" data-a="pick" data-i="${i}">${s.img?`<img src="${s.img}" alt="">`:'<div class="ph"></div>'}<div><b>${esc(label)}</b><span>${esc(desc(s))}</span><span>${new Date(s.t).toLocaleString('es-ES')} · ${fmtPT(s.pt)}</span></div></button>`
    :`<button class="slot empty" data-a="pick" data-i="${i}"><div class="ph"></div><div><b>${esc(label)} · vacía</b><span>${mode==='save'?'Guardar aquí':'—'}</span></div></button>`;
  let html=mode==='load'&&auto?item(auto,'auto','Autoguardado'):'';html+=all.map((s,i)=>item(s,i,'Ranura '+(i+1))).join('');
  CD.overlay(CD.sideScr(mode==='save'?'Guardar':'Cargar',mode==='save'?'Guardar partida':'Cargar partida',`<div class="slots">${html}</div>`,
    {w:600,menu:`<div class="menu">${mode==='load'&&all.some(Boolean)?'<button data-a="del">Borrar una ranura</button>':''}<button data-a="back">Volver</button></div>`}),{back,
    del:()=>CD.overlay(CD.sideScr('Cargar','Borrar ranura',`<div class="slots">${all.map((s,i)=>s?`<button class="slot" data-a="d" data-i="${i}">${s.img?`<img src="${s.img}" alt="">`:'<div class="ph"></div>'}<div><b>Ranura ${i+1}</b><span>${esc(desc(s))}</span></div></button>`:'').join('')}</div>`,{w:600}),
      {back:()=>showSlots('load',back),d:b=>CD.confirm('¿Borrar la ranura '+(+b.dataset.i+1)+'? No se puede deshacer.',()=>{store.del('cd4_slot_'+b.dataset.i);showSlots('load',back);},()=>showSlots('load',back))}),
    pick:b=>{const i=b.dataset.i;
      if(mode==='load'){const s=i==='auto'?auto:all[i];if(!s)return;if(G.st)CD.confirm('¿Cargar esta partida? Perderás lo que no hayas guardado.',()=>loadSnap(s),()=>showSlots(mode,back));else loadSnap(s);}
      else{const doSave=()=>{const s=CD.snapshot();s.img=thumbImg;store.set('cd4_slot_'+i,s);CD.note('Partida guardada en la ranura '+(+i+1),'up');CD.sfx('good');showSlots('save',back);};
        if(all[i])CD.confirm('¿Sobrescribir la ranura '+(+i+1)+'?',doSave,()=>showSlots(mode,back));else doSave();}}});
}

CD.startGame=function(st,snap){
  G.st=st;G.mode='game';G.busy=false;G.paused=false;G.cell=false;document.body.classList.add('ingame');document.body.classList.remove('cell');CD.hideOverlay();CD.fadeReset();
  CD.decorate(st.ch);CD.spawnPeds();PL.hp=100;CD.emit('gameStart',snap||null);
  if(snap&&snap.pos){CD.placePlayer(snap.pos[0],snap.pos[1],snap.yaw||0);G.hour=snap.hour||10;CD.hudStats();CD.flow();}else CD.showCard();
};

CD.showCard=function(){const ch=L.CHAPTERS[G.st.ch];G.busy=true;
  CD.overlay(CD.panel(`<div class="year">${ch.year}</div><div class="kick">${esc(ch.date)}</div><h2>Capítulo ${ch.roman} · ${esc(ch.title)}</h2><p>${esc(ch.text)}</p><div class="menu"><button data-primary data-a="go">Comenzar</button></div>`),
    {go:()=>{CD.hideOverlay();CD.beginChapter();}});};
CD.beginChapter=function(){
  const ch=L.CHAPTERS[G.st.ch];G.hour={dia:10,tarde:18.3,gris:12,oscuro:21.3}[ch.mood]||10;CD.decorate(G.st.ch);
  CD.placePlayer(W.bc(W.PLAZA[0]),W.bc(W.PLAZA[1])+15,Math.PI);G.cp=.3;G.busy=false;CD.spawnPeds();CD.hudStats();CD.autosave();CD.emit('chapter',G.st.ch);
  if(G.st.ch>1){const cost=Math.max(2,Math.round(G.st.s.partido/12));setTimeout(()=>{api.fx({fondos:-cost});CD.help(`Mantener el partido cuesta dinero: sedes, imprenta, viajes. −${cost} fondos.`,5000);if(G.st.s.fondos<8)api.fx({partido:-4});},2500);}

CD.showDiary=function(fromPause){G.paused=true;const s=G.st.s,f=G.st.f,ch=L.CHAPTERS[G.st.ch];

  const w=[];if(s.cordura<20)w.push('Estás al borde del colapso. Descansa en casa o en una tertulia.');else if(s.cordura<40)w.push('El cansancio empieza a pesarte.');
  if(s.izquierda>=35)w.push(s.izquierda>=50?'Tus ideas se han acercado mucho a la izquierda obrera.':'Te descubres dando la razón a los obreros más de lo que querrías.');

const HAIRC=['#1a120c','#3a2a1c','#5a3a22','#8a6a48','#b89a6a','#7a7a7a','#c8c8c8'];
const LISTS={hair:CD.HAIRS,beard:CD.BEARDS,hat:CD.HATS};
let edYaw=0,edA=0,edDrag=null;
CD.on('camera',()=>{if(G.mode!=='editor')return;const p=PL.g.position,a=edA,rx=Math.cos(a),rz=-Math.sin(a),wide=innerWidth>760?.55:0;PL.g.rotation.y=edYaw;
  cam.position.set(p.x+Math.sin(a)*2.5,p.y+1.55,p.z+Math.cos(a)*2.5);cam.lookAt(p.x+rx*wide,p.y+1.35,p.z+rz*wide);});
$('#ov').addEventListener('pointerdown',e=>{if(G.mode==='editor'&&!e.target.closest('.side'))edDrag=e.clientX;});
addEventListener('pointermove',e=>{if(edDrag!=null){edYaw+=(e.clientX-edDrag)*.012;edDrag=e.clientX;}});addEventListener('pointerup',()=>{edDrag=null;});
CD.on('update',dt=>{if(G.mode==='editor'&&edDrag==null)edYaw+=dt*.25;});
CD.showEditor=function(done,isNew,cancel){
  const prev=G.mode,saved=Object.assign({},CD.look),lk=CD.look;if(!lk.hatC)lk.hatC='#2a2420';
  G.mode='editor';G.paused=false;CD.camOwner=true;document.body.classList.remove('ingame');
  if(isNew){CD.placePlayer(W.bc(W.PLAZA[0]),W.bc(W.PLAZA[1])+15,Math.PI);G.hour=10;}
  edA=PL.yaw;edYaw=edA;CD.buildPlayer();
  const restore=()=>{CD.camOwner=false;G.mode=prev==='editor'?'title':prev;if(G.mode==='game')document.body.classList.add('ingame');};
  const cyc=(k,d)=>{const arr=LISTS[k],i=Math.max(0,arr.findIndex(a=>a[0]===(lk[k]||'')));lk[k]=arr[(i+d+arr.length)%arr.length][0];upd();};
  const upd=()=>{CD.buildPlayer();render();};
  function render(){
    const row=(k,label)=>{const arr=LISTS[k],i=Math.max(0,arr.findIndex(a=>a[0]===(lk[k]||'')));return `<div class="opt2"><b>${label}</b><div class="arr"><button data-a="prev" data-k="${k}" aria-label="Anterior">◀</button><span>${esc(arr[i][1])}</span><button data-a="next" data-k="${k}" aria-label="Siguiente">▶</button></div></div>`;};
    const sw=(k,cols,label)=>`<div class="opt2"><b>${label}</b><div class="sw">${cols.map(c=>`<button data-a="col" data-k="${k}" data-v="${c}" class="${lk[k]===c?'on':''}" style="background:${c}" aria-label="Color ${c}"></button>`).join('')}</div></div>`;
    CD.overlay(CD.sideScr(isNew?'Nueva partida':'Aspecto',isNew?'Tu personaje':'Personaje',
      `${row('hair','Peinado')}${sw('hairC',HAIRC,'Color de pelo')}${row('beard','Barba')}${sw('skin',CD.SKINS,'Tono de piel')}${row('hat','Sombrero')}<p class="small">Arrastra sobre el personaje para girarlo.</p>`,
      {right:true,menu:`<div class="menu"><button data-a="rand">Aleatorio</button><button data-primary data-a="ok">${isNew?'Empezar la partida':'Aceptar'}</button><button data-a="back">${isNew?'Volver':'Cancelar'}</button></div>`}),
      {prev:b=>cyc(b.dataset.k,-1),next:b=>cyc(b.dataset.k,1),col:b=>{lk[b.dataset.k]=b.dataset.v;upd();},
       rand:()=>{lk.hair=pick(CD.HAIRS)[0];lk.beard=pick(CD.BEARDS)[0];lk.hairC=pick(HAIRC);lk.skin=pick(CD.SKINS);lk.hat=pick(CD.HATS)[0];upd();},
       ok:()=>{store.set('cd4_look',lk);restore();PL.yaw=edYaw;done();},back:()=>{CD.look=saved;CD.buildPlayer();restore();cancel();}});}
  render();
};
